<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>자치회의 진행판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@400;600;800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">

<style>
:root{
  --paper:#F5F7F3; --surface:#FFFFFF; --surface-2:#EDF1EC;
  --ink:#16211C; --ink-2:#5A6B62; --ink-3:#8A9A91;
  --line:#DCE3DC; --line-2:#C7D2C9;
  --board:#1B4034; --board-2:#153529; --board-line:#2E5748;
  --chalk:#F3F7F1; --chalk-2:#A6BEB0; --chalk-3:#6E8A7C;
  --accent:#B5860F; --accent-ink:#7A5A08; --accent-soft:#F6EBCF;
  --good:#1F7D53; --mid:#B5860F; --bad:#B03656; --bad-on:#FFFFFF;
  --good-b:#57C08A; --mid-b:#EBC15A; --bad-b:#EE7C9C;
  --shadow:0 1px 2px rgba(22,33,28,.06), 0 8px 24px -12px rgba(22,33,28,.18);
  --r:10px;
  --display:"Hahmlet",Georgia,"Nanum Myeongjo",serif;
  --body:"IBM Plex Sans KR","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono","IBM Plex Sans KR",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E1512; --surface:#17201B; --surface-2:#1E2822;
    --ink:#E9F0EA; --ink-2:#94A79C; --ink-3:#6E8277;
    --line:#263229; --line-2:#33453A;
    --board:#163329; --board-2:#102820; --board-line:#2A4A3D;
    --accent:#E0A947; --accent-ink:#EEC684; --accent-soft:#2E2818;
    --good:#57C08A; --mid:#EBC15A; --bad:#EE7C9C; --bad-on:#2A0D16;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --paper:#0E1512; --surface:#17201B; --surface-2:#1E2822;
  --ink:#E9F0EA; --ink-2:#94A79C; --ink-3:#6E8277;
  --line:#263229; --line-2:#33453A;
  --board:#163329; --board-2:#102820; --board-line:#2A4A3D;
  --accent:#E0A947; --accent-ink:#EEC684; --accent-soft:#2E2818;
  --good:#57C08A; --mid:#EBC15A; --bad:#EE7C9C;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);line-height:1.6;
  -webkit-font-smoothing:antialiased;word-break:keep-all}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shared controls ---------- */
.btn{display:inline-flex;align-items:center;gap:.45em;border:1px solid var(--line-2);
  background:var(--surface);color:var(--ink);padding:.6em 1.1em;border-radius:var(--r);
  cursor:pointer;font-weight:500;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-2);border-color:var(--ink-3)}
.btn-primary{background:var(--board);color:var(--chalk);border-color:var(--board)}
.btn-primary:hover{background:var(--board-2);border-color:var(--board-2)}
.btn-ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn-ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn-sm{padding:.35em .75em;font-size:.85rem}
.btn-danger{background:var(--bad);border-color:var(--bad);color:var(--bad-on);font-weight:600}
.btn-danger:hover{background:var(--bad);border-color:var(--bad);filter:brightness(1.08)}
.delq{font-size:.85rem;color:var(--bad);font-weight:600;align-self:center}
.mrow.confirming{border-color:var(--bad);box-shadow:inset 3px 0 0 var(--bad)}
.field{display:flex;flex-direction:column;gap:.3rem}
.field>label{font-size:.75rem;font-weight:600;letter-spacing:.06em;color:var(--ink-2)}
.inp{background:var(--surface);border:1px solid var(--line-2);border-radius:8px;
  padding:.55em .7em;width:100%}
.inp:hover{border-color:var(--ink-3)}
textarea.inp{resize:vertical;min-height:5.5em;line-height:1.7}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- page shell ---------- */
.page{max-width:62rem;margin:0 auto;padding:2.2rem 1.5rem 4rem}
.masthead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;
  gap:1rem;padding-bottom:1.1rem;border-bottom:2px solid var(--ink);margin-bottom:1.8rem}
.masthead .school{font-family:var(--display);font-size:1.7rem;font-weight:800;letter-spacing:-.01em}
.masthead .sub{font-size:.8rem;color:var(--ink-2);letter-spacing:.1em;font-weight:600}
.tools{display:flex;gap:.4rem;flex-wrap:wrap}

.section-label{font-size:.72rem;font-weight:700;letter-spacing:.16em;color:var(--ink-2);
  margin:0 0 .85rem}

/* ---------- home ---------- */
.start-card{background:var(--board);color:var(--chalk);border-radius:14px;padding:1.6rem 1.7rem;
  display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1.2rem;
  margin-bottom:2.4rem;
  background-image:linear-gradient(135deg,rgba(255,255,255,.05),transparent 60%)}
.start-card h2{font-family:var(--display);font-size:1.55rem;font-weight:800;color:var(--chalk)}
.start-card .hint{font-size:.88rem;color:var(--chalk-2);margin-top:.3rem}
.start-card .btn{background:var(--chalk);color:var(--board);border-color:var(--chalk);
  font-weight:700;padding:.75em 1.5em}
.start-card .btn:hover{background:#fff;border-color:#fff}

.setup{border:1px solid var(--accent);background:var(--accent-soft);border-radius:14px;
  padding:1.5rem 1.6rem;margin-bottom:1.6rem}
.setup h2{font-family:var(--display);font-size:1.35rem;font-weight:800;color:var(--ink)}
.setup-lead{font-size:.95rem;color:var(--ink-2);margin-top:.3rem}
.setup-note{font-size:.85rem;color:var(--accent-ink);margin-top:1rem}
.setup .inp{background:var(--surface)}

.mlist{display:flex;flex-direction:column;gap:.7rem}
.mrow{display:grid;grid-template-columns:4.2rem 1fr auto;align-items:center;gap:1.1rem;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:1rem 1.1rem}
.mrow .no{font-family:var(--mono);font-size:1.55rem;font-weight:600;color:var(--accent-ink);
  line-height:1;text-align:center}
.mrow .no small{display:block;font-size:.6rem;letter-spacing:.1em;color:var(--ink-3);
  font-family:var(--body);font-weight:600;margin-top:.25rem}
.mrow .topic{font-weight:600;font-size:1.02rem}
.mrow .meta{font-size:.8rem;color:var(--ink-2);margin-top:.15rem;
  display:flex;gap:.7rem;flex-wrap:wrap}
.mrow .acts{display:flex;gap:.35rem;flex-wrap:wrap;justify-content:flex-end}
.tally{display:inline-flex;align-items:center;gap:.3rem;font-family:var(--mono);font-size:.78rem}
.dot{width:.5rem;height:.5rem;border-radius:50%;display:inline-block}
.empty{border:1px dashed var(--line-2);border-radius:var(--r);padding:2rem;
  text-align:center;color:var(--ink-2)}

/* ---------- prep form ---------- */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:1rem 1.2rem}
.carry{background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r);
  padding:1rem 1.1rem;margin:1.6rem 0}
.carry .tag{font-size:.7rem;font-weight:700;letter-spacing:.14em;color:var(--accent-ink)}
.carry ol{margin:.6rem 0 0;padding-left:1.3rem;color:var(--ink);font-size:.95rem}
.carry ol li{margin:.15rem 0}
.form-actions{display:flex;gap:.6rem;justify-content:flex-end;margin-top:2rem;
  border-top:1px solid var(--line);padding-top:1.4rem}

/* ---------- run / board ---------- */
/* 전자칠판 기준. 슬라이드 글자는 모두 이 값의 배수로 잡아, 화면이 커지면 같이 커진다.
   너비뿐 아니라 높이도 보게 해서(min) 세로로 넘치지 않게 한다. --ts 는 사용자가 고르는 배율. */
.stage{height:100svh;overflow:hidden;position:relative;background:var(--board);color:var(--chalk);
  display:flex;flex-direction:column;
  font-size:calc(clamp(16px, min(1.65vw, 3vh), 42px) * var(--ts,1));
  background-image:radial-gradient(120% 90% at 15% 0%,rgba(255,255,255,.045),transparent 60%)}
/* 위아래 조작 줄은 커지면 안 되므로 기준을 되돌린다 */
.rail,.controls,.audiobar{font-size:1rem}
.rail{display:flex;gap:1px;padding:0 max(1.2rem,3vw);background:var(--board-2);
  overflow-x:auto;scrollbar-width:thin;flex:0 0 auto}
.rail button{flex:0 0 auto;background:transparent;border:0;border-bottom:3px solid transparent;
  color:var(--chalk-3);padding:.7rem .8rem;cursor:pointer;font-size:.78rem;font-weight:600;
  white-space:nowrap;display:flex;align-items:baseline;gap:.4rem}
.rail button:hover{color:var(--chalk-2)}
.rail button .n{font-family:var(--mono);font-size:.72rem}
.rail button[aria-current="true"]{color:var(--chalk);border-bottom-color:var(--mid-b)}
.rail button.filled .n{color:var(--good-b)}

.slide{flex:1;min-height:0;overflow-y:auto;display:grid;align-content:safe center;
  padding:1.1em max(1.2rem,3vw);gap:.7em;
  max-width:92rem;width:100%;margin:0 auto;scrollbar-width:thin}
.slide.dense h2{font-size:2.5em}
.slide.dense .verse{font-size:2.1em}
.eyebrow{font-family:var(--mono);font-size:.95em;color:var(--mid-b);
  letter-spacing:.22em;font-weight:600}
.slide h2{font-family:var(--display);font-weight:800;letter-spacing:-.02em;line-height:1.15;
  font-size:3.6em;color:var(--chalk)}
.slide .lead{font-size:1.4em;color:var(--chalk-2);max-width:44ch}
.verse{font-family:var(--display);font-size:2.6em;line-height:1.6;
  font-weight:400;color:var(--chalk);white-space:pre-wrap;max-width:26ch}
.verse .refrain{color:var(--chalk-2)}

.b-card{background:rgba(255,255,255,.05);border:1px solid var(--board-line);border-radius:12px;
  padding:.7em .8em}
.b-inp{background:rgba(0,0,0,.22);border:1px solid var(--board-line);color:var(--chalk);
  border-radius:9px;padding:.55em .7em;width:100%;font-size:1.3em}
.b-inp::placeholder{color:var(--chalk-3)}
.b-inp:hover{border-color:var(--chalk-3)}
.b-btn{background:rgba(255,255,255,.08);border:1px solid var(--board-line);color:var(--chalk);
  border-radius:9px;padding:.55em 1em;cursor:pointer;font-weight:600}
.b-btn:hover{background:rgba(255,255,255,.16)}

/* vote tiles */
.votes{display:grid;grid-template-columns:repeat(3,1fr);gap:.55em}
.vt{border:1px solid var(--board-line);border-radius:12px;padding:.6em;
  background:rgba(0,0,0,.18);display:flex;flex-direction:column;gap:.35em;align-items:center;
  border-top:4px solid var(--vc)}
.vt .lab{font-size:1.15em;font-weight:700;color:var(--vc);text-align:center}
.vt .num{font-family:var(--mono);font-size:3.4em;font-weight:600;
  line-height:1;color:var(--chalk);font-variant-numeric:tabular-nums}
.vt .pm{display:flex;gap:.4rem}
.vt .pm button{width:2.6rem;height:2.3rem;font-size:1.15rem;line-height:1;
  background:rgba(255,255,255,.08);border:1px solid var(--board-line);color:var(--chalk);
  border-radius:8px;cursor:pointer;font-weight:600}
.vt .pm button:hover{background:rgba(255,255,255,.18)}
.vt .key{font-family:var(--mono);font-size:.68rem;color:var(--chalk-3)}
.meter{display:flex;height:.5em;min-height:12px;border-radius:7px;overflow:hidden;gap:2px;
  background:transparent}
.meter span{transition:flex-grow .25s}
.meter-note{display:flex;justify-content:space-between;font-size:1em;color:var(--chalk-2);
  font-family:var(--mono);margin-top:.3em}

/* editable lists on the board */
.plist{display:flex;flex-direction:column;gap:.35em;margin:0;padding:0;list-style:none}
.plist li{display:flex;align-items:center;gap:.6em;background:rgba(0,0,0,.2);
  border:1px solid var(--board-line);border-radius:10px;padding:.4em .55em .4em .7em;
  font-size:1.55em}
/* 항목이 늘어도 한 화면에 담기게 한 단계씩 줄인다 */
.plist.many li{font-size:1.25em}
.plist.lots li{font-size:1.05em}
.plist li .bullet{font-family:var(--mono);color:var(--mid-b);font-size:.85em;flex:0 0 auto}
.plist li .txt{flex:1}
.plist li .del{background:transparent;border:0;color:var(--chalk-3);cursor:pointer;
  font-size:1.1rem;padding:.1em .4em;border-radius:6px;flex:0 0 auto}
.plist li .del:hover{color:var(--bad-b);background:rgba(255,255,255,.08)}
.addrow{display:flex;gap:.5rem;margin-top:.2rem}
.chips{display:flex;gap:.3em;flex-wrap:wrap;margin-top:.4em}
.chip{background:rgba(255,255,255,.07);border:1px solid var(--board-line);color:var(--chalk-2);
  border-radius:999px;padding:.35em .9em;cursor:pointer;font-size:.95em}
.chip:hover{background:rgba(255,255,255,.16);color:var(--chalk)}

/* audio player */
.audiobar{flex:0 0 auto;display:flex;align-items:center;gap:.85rem;
  padding:.55rem max(1.2rem,3vw);background:rgba(0,0,0,.26);
  border-top:1px solid var(--board-line)}
.pbtn{width:3.1rem;height:3.1rem;border-radius:50%;border:0;background:var(--mid-b);color:#14332A;
  font-size:1.2rem;cursor:pointer;display:grid;place-items:center;flex:0 0 auto;font-weight:700;
  line-height:1;padding:0}
.pbtn:hover{filter:brightness(1.1)}
.ptrack{flex:1;height:9px;background:rgba(255,255,255,.15);border-radius:5px;cursor:pointer;
  position:relative;overflow:hidden}
.pfill{height:100%;background:var(--mid-b);width:0;border-radius:5px}
.ptime{font-family:var(--mono);font-size:.88rem;color:var(--chalk-2);flex:0 0 auto;
  font-variant-numeric:tabular-nums}
.pnote{font-size:.85rem;color:var(--chalk-3)}
@media (max-width:640px){.pnote.pkey{display:none}}
/* 자동 재생이 막혀 한 번 눌러야 할 때 — 단추를 두드러지게 */
.audiobar.is-waiting .ptime{color:var(--mid-b);font-weight:700}
.audiobar.is-waiting .pbtn{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(235,193,90,.55)}50%{box-shadow:0 0 0 .6rem rgba(235,193,90,0)}}
@media (prefers-reduced-motion:reduce){.audiobar.is-waiting .pbtn{animation:none;outline:3px solid var(--mid-b)}}
.audiobar.is-failed .ptime{color:var(--bad-b);font-weight:600}
.audiobar.is-failed .pbtn{opacity:.4;cursor:not-allowed}
.arow{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;padding:.7rem 0;
  border-top:1px solid var(--line)}
.arow:first-of-type{border-top:0}
.arow .nm{flex:1;min-width:8rem;font-weight:600}
.arow .st{font-size:.8rem;color:var(--ink-2)}
.arow input[type=file]{max-width:15rem;font-size:.82rem}
/* 여는 놀이 */
.icetabs{display:flex;gap:.3em;flex-wrap:wrap}
/* 놀이 고르기 판 — 칠판 가득 카드 아홉 장 */
.ice-sub{margin-top:-.3em}
.icegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:.45em}
@media (max-width:640px){.icegrid{grid-template-columns:repeat(2,1fr)}}
.icegame{display:flex;flex-direction:column;align-items:flex-start;gap:.12em;text-align:left;cursor:pointer;
  background:rgba(255,255,255,.06);border:1px solid var(--board-line);border-radius:14px;padding:.5em .7em;
  color:var(--chalk);transition:background .15s,transform .15s}
.icegame:hover{background:rgba(255,255,255,.12);transform:translateY(-2px)}
.icegame:focus-visible{outline:3px solid var(--mid-b);outline-offset:2px}
.ig-emo{font-size:1.7em;line-height:1.1}
.ig-name{font-size:1.1em;font-weight:700;font-family:var(--display)}
.ig-desc{font-size:.68em;color:var(--chalk-3);line-height:1.35}
.icehead{display:flex;align-items:center;gap:.6em;flex-wrap:wrap}
.icehead .b-btn{font-size:1rem}
.slide h2.iceh2{font-size:2.1em}
.icecard.big{font-size:2.4em;text-align:center}
.ice-c{text-align:center;max-width:none}
.icecenter{display:flex;flex-direction:column;align-items:center;gap:.25em;text-align:center}
.pop{animation:icepop .32s cubic-bezier(.2,1.5,.5,1)}
@keyframes icepop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
/* 밸런스 게임 — 두 쪽 색은 좋다·나쁘다로 읽히지 않게 하늘색과 주황 */
.stage{--bal-a:#6FB7FF;--bal-b:#FFA15C}
.balwrap{display:grid;grid-template-columns:1fr auto 1fr;gap:.5em;align-items:stretch}
.balcard{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25em;text-align:center;
  background:rgba(0,0,0,.18);border:1px solid var(--board-line);border-radius:14px;padding:.6em .5em;
  border-top:6px solid var(--bal-a)}
.balcard.b{border-top-color:var(--bal-b)}
.balcard.lead.a{background:rgba(111,183,255,.16)} .balcard.lead.b{background:rgba(255,161,92,.16)}
.baltxt{font-family:var(--display);font-weight:700;font-size:1.7em;line-height:1.25;word-break:keep-all}
.balnum{font-size:3em;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.balcard.a .balnum{color:var(--bal-a)} .balcard.b .balnum{color:var(--bal-b)}
.balvs{align-self:center;font-family:var(--display);font-weight:800;font-size:1.4em;color:var(--chalk-3)}
@media (max-width:640px){.balwrap{grid-template-columns:1fr}.balvs{justify-self:center}}
/* 가위바위보 */
.rpsbig{font-size:6.5em;line-height:1.05}
.rpscount{font-family:var(--display);font-weight:800;font-size:5em;color:var(--mid-b);line-height:1.1}
.rpsname{font-size:1.7em}
.rpsname b{color:var(--mid-b)}
/* OX */
.oxrow{display:flex;align-items:center;justify-content:center;gap:.5em;flex-wrap:wrap}
.oxans{font-family:var(--display);font-weight:900;font-size:6em;line-height:1}
.oxans.o{color:var(--good-b)} .oxans.x{color:var(--bad-b)}
.oxrow .lead{max-width:24em;text-align:left}
/* 사라진 그림 찾기 */
.missgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:.4em}
.misscell{display:flex;flex-direction:column;align-items:center;gap:.05em;padding:.35em .2em;border-radius:12px;
  background:rgba(255,255,255,.06);border:1px solid var(--board-line)}
.misscell .e{font-size:2.5em;line-height:1.15}
.misscell .n{font-size:.8em;color:var(--chalk-2)}
.misscell.q .e{color:var(--chalk-3);font-family:var(--display);font-weight:800}
.misscell.hit{background:rgba(235,193,90,.2);border-color:var(--mid-b);box-shadow:0 0 0 2px var(--mid-b)}
.missleft{font-family:var(--mono);color:var(--mid-b);font-size:1.4em}
/* 몸으로 말해요 */
.actword{font-family:var(--display);font-weight:800;font-size:3.8em;line-height:1.15;word-break:keep-all}
.actrow{display:flex;align-items:center;gap:1.2em}
.acttime{font-size:2.6em;font-weight:600;color:var(--mid-b);min-width:2ch;text-align:center}
.actscore{display:flex;flex-direction:column;align-items:center}
.actscore b{font-size:2em;line-height:1}
.actscore span{font-size:.7em;color:var(--chalk-3);letter-spacing:.1em}
.actlist{display:flex;flex-wrap:wrap;gap:.3em;justify-content:center;max-width:40em}

<script>
"use strict";
const KEY = "jachihoe.v1";
const $ = (s, r=document) => r.querySelector(s);

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function todayISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function fmtDate(iso){
  if(!iso) return "";
  const [y,m,d]=iso.split("-").map(Number);
  const dt=new Date(y,m-1,d);
  return y+"년 "+m+"월 "+d+"일 "+"일월화수목금토"[dt.getDay()]+"요일";
}

const ALL_STEPS=[
  {id:"cover",   n:null, label:"개회"},
  {id:"ice",     n:null, label:"여는 놀이"},
  {id:"ceremony",n:"01", label:"국민의례"},
  {id:"pledge",  n:"02", label:"국기에 대한 맹세"},
  {id:"anthem",  n:"03", label:"애국가 제창"},
  {id:"review",  n:"04", label:"이번달 실천내용 반성"},
  {id:"goal",    n:"05", label:"다음달 생활 목표"},
  {id:"promise", n:"06", label:"다음달 실천내용"},
  {id:"suggest", n:"07", label:"건의사항"},
  {id:"words",   n:"08", label:"선생님 말씀"},
  {id:"song",    n:"09", label:"교가 제창"},
  {id:"close",   n:null, label:"폐회사"}
];
/* 여는 놀이는 설정에서 끌 수 있어 순서가 달라진다. 화면 번호를 박아 쓰지 말 것 */
function steps(){ return ALL_STEPS.filter(s=>s.id!=="ice"||db.settings.iceOn); }
function stepIndex(id){ return steps().findIndex(s=>s.id===id); }
function railBtn(id){
  const i=stepIndex(id);
  return i<0?null:document.querySelector(`.rail button[data-i="${i}"]`);
}

/* 한글 초성 뽑기 — 초성 퀴즈용 */
const CHO=["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
function toCho(s){
  return [...String(s)].map(ch=>{
    const c=ch.charCodeAt(0)-0xAC00;
    return (c<0||c>11171) ? ch : CHO[Math.floor(c/588)];
  }).join(" ");

function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){db=JSON.parse(raw); db.settings=Object.assign({},DEFAULTS.settings,db.settings);
      /* 놀이상자를 합치기 전에 쓰던 설정: 선생님이 고친 질문·낱말은 두고, 새 것만 한 번 덧붙인다 */
      if((db.settings.iceVer||0)<2){
        const add=(key,keyOf)=>{
          const cur=Array.isArray(db.settings[key])?db.settings[key]:[];
          const have=new Set(cur.map(keyOf));
          db.settings[key]=cur.concat(DEFAULTS.settings[key].filter(x=>!have.has(keyOf(x))));
        };
        add("questions",x=>String(x).trim());
        add("quiz",x=>String(x).split("|")[0].trim());
        db.settings.iceVer=2;
      }
      /* 표결 기능 이전에 만든 회의에도 빈 후보 목록을 달아 준다 */
      (db.meetings||[]).forEach(mm=>{
        if(!Array.isArray(mm.goalVote)) mm.goalVote=[];
        if(!Array.isArray(mm.iceAnswers)) mm.iceAnswers=[];
        if(!Array.isArray(mm.reviewNotes)) mm.reviewNotes=[];
        if(!Array.isArray(mm.promiseVote)) mm.promiseVote=[];
      });
      db.meetings=db.meetings||[]; return;}
  }catch(e){}
  db=JSON.parse(JSON.stringify(DEFAULTS));
}

    rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error);
  });
}
async function idbLoadAll(){
  try{
    const d=await idb(), tx=d.transaction("t","readonly").objectStore("t");
    for(const k of Object.keys(AUDIO)){
      const v=await new Promise(r=>{const q=tx.get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null);});
      if(v) userAudio[k]=v;
    }
  }catch(e){}
}
async function idbPut(k,v){
  const d=await idb();
  return new Promise((res,rej)=>{
    const tx=d.transaction("t","readwrite");
    tx.objectStore("t").put(v,k);
    tx.oncomplete=res; tx.onerror=()=>rej(tx.error);
  });
}
async function idbDel(k){
  const d=await idb();
  return new Promise(res=>{
    const tx=d.transaction("t","readwrite"); tx.objectStore("t").delete(k); tx.oncomplete=res;
  });
}

function srcFor(k){ return userAudio[k] || (AUDIO[k]&&AUDIO[k].startsWith("data:") ? AUDIO[k] : ""); }
function hasAudio(k){ return !!srcFor(k); }

/* 수백 KB짜리 data: 주소를 그대로 재생하면 브라우저·보안 환경에 따라 막히거나 멈춘다.
   그래서 바이트로 풀어 blob: 주소로 재생하고, 그게 막히는 곳에서만 data: 로 되돌아간다.
   곡마다 재생기를 따로 두어, 화면을 오가도 이전 곡의 이벤트가 섞이지 않게 한다. */
const blobURL={}, players={};
let audioEl=null, audioKey=null;
function blobFor(k){
  if(blobURL[k]) return blobURL[k];
  const src=srcFor(k);
  if(!src.startsWith("data:")) return src;
  try{
    const i=src.indexOf(","), head=src.slice(0,i);
    const mime=(head.match(/^data:([^;,]+)/)||[])[1]||"audio/mpeg";
    const bin=atob(src.slice(i+1)), u8=new Uint8Array(bin.length);
    for(let j=0;j<bin.length;j++) u8[j]=bin.charCodeAt(j);
    return blobURL[k]=URL.createObjectURL(new Blob([u8],{type:mime}));
  }catch(e){ return src; }
}
/* 음원을 바꿔 넣었을 때 옛 재생기와 blob 을 버린다 */
function dropPlayer(k){
  if(players[k]){ players[k].pause(); delete players[k]; }
  if(blobURL[k]){ try{ URL.revokeObjectURL(blobURL[k]); }catch(e){} delete blobURL[k]; }
  if(audioKey===k){ audioKey=null; audioEl=null; }
}
function playerFor(k){
  if(players[k]) return players[k];
  const a=new Audio(); a.preload="auto"; a._stage="blob";
  ["timeupdate","play","pause","ended","loadedmetadata","durationchange","canplay"].forEach(ev=>
    a.addEventListener(ev,()=>{ if(a===audioEl) paintAudio(); }));
  a.addEventListener("error",()=>{
    if(a._stage==="blob"){                     /* blob 이 막힌 환경이면 data: 로 한 번 더 */
      a._stage="data"; a.src=srcFor(k); a.load();
      if(a===audioEl&&a._wantPlay) a.play().catch(()=>{ a._blocked=true; paintAudio(); });
      return;
    }
    a._failed=true; if(a===audioEl) paintAudio();
  });
  a.src=blobFor(k);
  return players[k]=a;
}
function mmss(s){
  if(!isFinite(s)||s<0) s=0;
  return Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0");
}
/* 재생 줄은 '지금 무슨 상태인지'를 글로 보여 준다. 조용히 0:00 에 머물러 있으면 원인을 알 수 없다 */
function paintAudio(){
  const a=audioEl; if(!a) return;
  const fill=$("#pfill"), time=$("#ptime"), btn=$("#pbtn"), bar=$(".audiobar");
  if(bar){ bar.classList.toggle("is-failed",!!a._failed); bar.classList.toggle("is-waiting",!a._failed&&a.paused&&!!a._blocked); }
  if(fill) fill.style.width=(a.duration?(a.currentTime/a.duration*100):0)+"%";
  if(time){
    time.textContent = a._failed ? "소리 파일을 열지 못했습니다"
      : (a.paused&&a._why) ? "재생이 막혔습니다 · "+a._why      /* ▶를 눌렀는데도 막힌 이유 — 사라지지 않게 남긴다 */
      : (a.paused&&a._blocked&&!a.currentTime) ? "▶ 를 눌러 재생하세요"
      : mmss(a.currentTime)+" / "+mmss(a.duration);
  }
  if(btn){ btn.textContent=a.paused?"▶":"❚❚";
    btn.setAttribute("aria-label",a.paused?"재생":"멈춤"); btn.disabled=!!a._failed; }
}
/* 슬라이드를 옮길 때마다 소리를 그 슬라이드에 맞춘다 */
function syncAudio(){
  const key=(state.view==="run")?(steps()[state.step]||{}).id:null;
  const want=(key&&AUDIO[key]!==undefined&&hasAudio(key))?key:null;
  if(want===audioKey){ paintAudio(); return; }
  if(audioEl){ audioEl.pause(); audioEl._wantPlay=false; }
  audioKey=want; audioEl=want?playerFor(want):null;
  if(!audioEl) return;
  try{ audioEl.currentTime=0; }catch(e){}
  audioEl._blocked=false; audioEl._why="";
  if(db.settings.autoplay){
    audioEl._wantPlay=true;
    const a=audioEl;
    a.play().catch(()=>{ a._blocked=true; if(a===audioEl) paintAudio(); });
  }else audioEl._blocked=true;                  /* 자동 재생을 끈 경우에도 ▶ 안내를 띄운다 */
  paintAudio();
}
function toggleAudio(){
  const a=audioEl; if(!a) return;
  if(a._failed){ toast("소리 파일을 열지 못했습니다. 설정 → 음원에서 파일을 다시 넣어 보세요"); return; }
  if(a.paused){
    a._wantPlay=true;
    a.play().then(()=>{ a._blocked=false; a._why=""; paintAudio(); })
     .catch(err=>{
       const n=(err&&err.name)||"알 수 없음";
       a._blocked=true; a._why=n; paintAudio();
       /* 누른 뒤에도 NotAllowedError 면 이 화면(뷰어)이 소리를 허락하지 않는 것이다 */
       toast(n==="NotAllowedError"
         ? "이 화면에서는 소리를 켤 수 없습니다. 크롬이나 엣지 브라우저에서 앱 링크를 열어 주세요"
         : n==="NotSupportedError"
         ? "소리 파일을 열지 못했습니다. 설정 → 음원에서 파일을 다시 넣어 보세요"
         : "소리를 켜지 못했습니다 ("+n+"). 컴퓨터 소리와 음소거를 확인해 주세요", 6000);
     });
  } else a.pause();
}
/* 가사에 밀리지 않도록 진행 바 위 고정 줄에 둔다 */
function audioBarHTML(key){
  if(!(key in AUDIO)) return "";
  if(!hasAudio(key)) return `<div class="audiobar"><p class="pnote">설정 → 음원에서
    ${esc(TRACK_NAME[key])} 파일을 넣으면 여기서 바로 재생됩니다.</p></div>`;
  return `<div class="audiobar">
    <button class="pbtn" id="pbtn" data-act="toggle" aria-label="재생">▶</button>
    <div class="ptrack" id="ptrack" data-act="seek"><div class="pfill" id="pfill"></div></div>
    <div class="ptime mono" id="ptime">0:00 / 0:00</div>
    <span class="pnote pkey">P 키로 재생·멈춤</span>
  </div>`;
}

      <div class="eyebrow" style="letter-spacing:.14em;font-size:.8em">이번 달 회의주제</div>
      <input class="b-inp" data-bind="review.topic" value="${esc(r.topic)}"
        placeholder="이번 달 회의주제" style="font-family:var(--display);font-weight:600;
        font-size:2em;margin-top:.15em;border-color:transparent;background:transparent;
        padding-left:0">
      ${r.promises.length&&tab==="vote"?`<ol style="margin:.5em 0 0;padding-left:1.3em;color:var(--chalk-2);font-size:1.2em;line-height:1.75">
        ${r.promises.map(p=>`<li>${esc(p)}</li>`).join("")}</ol>`:""}
    </div>
    ${tabs}`;
    if(tab==="notes") return head+`
      <div class="rvnotes">${notes.map(n=>`<div class="rvnote">${esc(n)}</div>`).join("")}</div>
      <div><button class="b-btn" data-act="rv-clear" style="font-size:.8rem">의견 지우기</button></div>`;
    return head+`
    <div class="votes">
      ${vt("good","잘 지켜짐","var(--good-b)",r.good,"1")}
      ${vt("mid","보통","var(--mid-b)",r.mid,"2")}
      ${vt("bad","잘 안 지켜짐","var(--bad-b)",r.bad,"3")}
    </div>
    <div>
      <div class="meter" id="meter" role="img"
        aria-label="잘 지켜짐 ${r.good}명, 보통 ${r.mid}명, 잘 안 지켜짐 ${r.bad}명">
        ${tot?bar(r.good,"var(--good-b)")+bar(r.mid,"var(--mid-b)")+bar(r.bad,"var(--bad-b)")
          :`<span style="flex:1;background:var(--board-line)"></span>`}
      </div>
      <div class="meter-note"><span id="tot">응답 ${tot}명</span><span>참석 ${m.attendance}명</span></div>
    </div>`;
  }

  case "goal": {
    /* 후보가 모이면 주제 목록을 접어, 표가 한 화면에 들어오게 한다 */
    const gv=m.goalVote||[], openAdd=gv.length<2||state.goalAdd;
    return `
    <div class="eyebrow">05</div><h2>다음달 생활 목표</h2>
    <div id="gvwrap">${goalVoteHTML(m)}</div>
    ${openAdd?`
      <div class="addrow">
        <input class="b-inp" id="add-cand" data-add="cand" placeholder="후보 직접 넣기" style="flex:1">
        <button class="b-btn" data-act="gv-add">후보 넣기</button>
        ${gv.length>=2?`<button class="b-btn" data-act="gv-addtoggle">접기</button>`:""}
      </div>
      <div>
        <div class="eyebrow" style="letter-spacing:.14em;font-size:.72em">자주 쓰는 주제 · 눌러서 후보로</div>
        <div class="chips bank">${s.topicBank.map(t=>
          `<button class="chip" data-act="gv-addv" data-v="${esc(t)}">${esc(t)}</button>`).join("")}</div>
      </div>`
    :`<div><button class="b-btn" data-act="gv-addtoggle">후보 더 넣기</button></div>`}
    <div class="addrow">
      <span class="eyebrow" style="font-size:.72em;white-space:nowrap;align-self:center">정해진 목표</span>
      <input class="b-inp" data-bind="next.topic" value="${esc(m.next.topic)}"
        placeholder="투표로 정하거나 직접 적어 주세요"
        style="font-family:var(--display);font-weight:600;flex:1">
    </div>`;
  }

  case "promise": {
    const pvTab=promiseTab(m), pvN=(m.promiseVote||[]).length;
    return `
    <div class="eyebrow">06</div><h2>다음달 실천내용 <span style="font-size:.4em;font-weight:400;color:var(--chalk-2)">우리 약속</span></h2>
    <div class="pvhead">
      <div class="goalbanner">
        <span class="gb-lab">다음 달 생활 목표</span>
        ${m.next.topic
          ? `<span class="gb-t">${esc(m.next.topic)}</span>`
          : `<span class="gb-empty">아직 정하지 않았습니다</span>
             <button class="b-btn" data-act="goto" data-id="goal">목표 정하러 가기</button>`}
      </div>
      <div class="icetabs">
        <button class="icetab${pvTab==="vote"?" on":""}" data-act="pv-tab" data-k="vote">투표${pvN?` · 후보 ${pvN}`:""}</button>
        <button class="icetab${pvTab==="list"?" on":""}" data-act="pv-tab" data-k="list">정해진 약속 ${m.next.promises.length}</button>
      </div>
    </div>
    ${pvTab==="vote"?`
    <div id="pvwrap">${promiseVoteHTML(m)}</div>
    <div class="addrow">
      <input class="b-inp" id="add-pcand" placeholder="후보를 적고 Enter" data-add="pcand" style="flex:1;font-size:1em">
      <button class="b-btn" data-act="pv-add">후보 넣기</button>
    </div>`:`
    <ul class="${plistClass(m.next.promises.length,true)}" id="plist">${listItems(m.next.promises,"promise")}</ul>
    <div class="addrow">
      <input class="b-inp" id="add-promise" placeholder="약속을 적고 Enter" data-add="promise">
      <button class="b-btn" data-act="add" data-k="promise">추가</button>
    </div>`}`;
  }

  case "suggest": return `
    <div class="eyebrow">07</div><h2>건의사항</h2>
    <ul class="${plistClass(m.suggestions.length)}" id="slist">${listItems(m.suggestions,"suggest")}</ul>
    <div class="addrow">
      <input class="b-inp" id="add-suggest" placeholder="건의할 내용을 적고 Enter" data-add="suggest">
      <button class="b-btn" data-act="add" data-k="suggest">추가</button>
    </div>`;

  case "words": return `
    <div class="eyebrow">08</div><h2>선생님 말씀</h2>
    <textarea class="b-inp" data-bind="teacherWords" rows="5"
      placeholder="선생님 말씀을 적어 주세요" style="line-height:1.8">${esc(m.teacherWords)}</textarea>`;

  case "song": return `
    <div class="eyebrow">09</div><h2>${esc(s.songTitle||"교가")} 제창</h2>
    ${s.songLyrics.trim()
      ? `<div class="verse">${esc(s.songLyrics)}</div>`
      : `<p class="lead">설정에서 ${esc(s.songTitle||"교가")} 가사를 넣으면 이 화면에 표시됩니다.
         <button class="b-btn" data-act="settings" style="margin-left:.6rem">설정 열기</button></p>`}`;

  case "close": {
    const r=m.review;
    return `<h2>폐회사</h2>
    <p class="lead">이상으로 제 ${m.no}회 ${esc(m.scope)} 자치회의를 마치겠습니다.<br>모두 수고하셨습니다.</p>
    <div class="summary">
      <div class="b-card"><h3>이번 달 반성</h3>
        <p>${esc(r.topic)||"—"}</p>
        <p class="mono" style="font-size:.95rem;color:var(--chalk-2);margin-top:.3rem">
          ${r.good} · ${r.mid} · ${r.bad}</p></div>
      <div class="b-card"><h3>다음 달 주제</h3><p>${esc(m.next.topic)||"—"}</p></div>
      <div class="b-card"><h3>우리 약속</h3>
        ${m.next.promises.length?`<ol>${m.next.promises.map(p=>`<li>${esc(p)}</li>`).join("")}</ol>`
          :`<p style="color:var(--chalk-3)">아직 없음</p>`}</div>
    </div>
    <div class="addrow" style="margin-top:.6rem">
      <button class="b-btn" data-act="finish" style="background:var(--chalk);color:var(--board);border-color:var(--chalk);font-weight:700;padding:.7em 1.4em">회의록 만들기</button>
    </div>`;
  }
  }
  return "";
}

/* 다음 달 생활 목표 표결 — 후보를 올려 두고 거수로 센다 */
function goalVoteHTML(m){
  const gv=m.goalVote||[];
  if(!gv.length) return `<p class="lead">후보를 넣고 거수로 표를 세어 보세요. 투표 없이 바로 적어도 됩니다.</p>`;
  const max=Math.max(0,...gv.map(x=>x.v));
  const tot=gv.reduce((a,b)=>a+b.v,0);
  const leaders=gv.filter(x=>x.v===max&&max>0);
  return `<div class="gvotes">${gv.map((c,i)=>`
      <div class="gv${max>0&&c.v===max?" lead":""}">
        <button class="gv-x" data-act="gv-rm" data-i="${i}" title="후보 빼기" aria-label="후보 빼기">×</button>
        <div class="gv-t">${esc(c.t)}</div>
        <div class="gv-n mono">${c.v}</div>
        <div class="gv-pm">
          <button data-act="gv" data-i="${i}" data-d="-1" aria-label="한 표 빼기">−</button>
          <button data-act="gv" data-i="${i}" data-d="1" aria-label="한 표 더하기">+</button>
        </div>
        ${i<9?`<div class="gv-key mono">${i+1}</div>`:""}
      </div>`).join("")}</div>
    <div class="gv-foot"><span class="mono">모두 ${tot}표</span>
      ${leaders.length===1
        ? `<button class="b-btn draw-go" data-act="gv-pick" data-v="${esc(leaders[0].t)}">이 주제로 정하기</button>`
        : max>0 ? `<span class="gv-tie">표가 같습니다. 다시 세거나 한 번 더 투표해 주세요</span>` : ""}
    </div>`;
}

/* 다음 달 실천내용 표결 — 생활 목표는 하나를 뽑지만 약속은 여러 개라, 많은 순서로 N개를 정한다 */
function promiseTab(m){
  return state.promiseTab||((m.promiseVote||[]).length&&!m.next.promises.length?"vote":"list");
}
function promiseVoteHTML(m){
  const pv=m.promiseVote||[];
  if(!pv.length) return `<p class="lead">실천내용 후보를 넣고 거수로 표를 세어 보세요. 많이 받은 순서로 약속을 정합니다.</p>`;
  const N=Math.max(1,Math.min(pv.length,m.promiseN||3));
  const order=pv.map((c,i)=>({v:c.v,i})).sort((a,b)=>b.v-a.v||a.i-b.i);
  const tot=pv.reduce((a,c)=>a+c.v,0), cut=order[N-1], after=order[N];
  const tie=!!(cut&&after&&cut.v>0&&after.v===cut.v);
  const count=order.slice(0,N).filter(c=>c.v>0).length;
  const line=cut?cut.v:0;
  return `<div class="pvrows${pv.length>6?" many":""}">${pv.map((c,i)=>`
      <div class="pvrow${c.v>0&&c.v>=line?" top":""}">
        <span class="pvkey mono">${i+1}</span>
        <span class="pvt">${esc(c.t)}</span>
        <b class="pvnum mono">${c.v}</b>
        <span class="gv-pm">
          <button data-act="pv" data-i="${i}" data-d="-1" aria-label="한 표 빼기">−</button>
          <button data-act="pv" data-i="${i}" data-d="1" aria-label="한 표 더하기">+</button>
        </span>
        <button class="pvx" data-act="pv-rm" data-i="${i}" title="후보 빼기" aria-label="후보 빼기">×</button>
      </div>`).join("")}</div>
    <div class="gv-foot"><span class="mono">모두 ${tot}표</span>
      <span class="pvn">많은 순서로
        <button class="b-btn" data-act="pv-n" data-d="-1" aria-label="개수 줄이기">−</button>
        <b class="mono">${N}</b>개
        <button class="b-btn" data-act="pv-n" data-d="1" aria-label="개수 늘리기">+</button></span>
      ${tie?`<span class="gv-tie">${N}번째와 표가 같은 후보가 있습니다. 다시 세거나 개수를 바꿔 주세요</span>`
        :count?`<button class="b-btn draw-go" data-act="pv-pick">이 ${count}개로 정하기</button>`:""}
    </div>`;
}
function paintPv(){
  const m=current(), w=$("#pvwrap"); if(w) w.innerHTML=promiseVoteHTML(m);
  const rail=railBtn("promise"); if(rail) rail.classList.toggle("filled",stepFilled(m,"promise"));
}
function bumpPv(i,d){
  const m=current(), pv=m.promiseVote||[]; if(!pv[i]) return;
  pv[i].v=Math.max(0,(pv[i].v||0)+d); m.updatedAt=Date.now(); save(); paintPv();
}
function addPv(t){
  const m=current(), v=String(t||"").trim(); if(!v) return;
  m.promiseVote=m.promiseVote||[];
  if(m.promiseVote.some(c=>c.t===v)){ toast("이미 올라온 후보입니다"); return; }
  if(m.promiseVote.length>=9){ toast("후보는 9개까지 넣을 수 있습니다"); return; }
  m.promiseVote.push({t:v,v:0}); m.updatedAt=Date.now(); save(); render();
  const i=$("#add-pcand"); if(i){ i.value=""; i.focus(); }
}
/* 표결로 뽑힌 것만 바꾸고, 선생님이 직접 적어 둔 약속은 그대로 둔다 */
function pickPv(){
  const m=current(), pv=m.promiseVote||[], N=Math.max(1,Math.min(pv.length,m.promiseN||3));
  const top=pv.map((c,i)=>({...c,i})).sort((a,b)=>b.v-a.v||a.i-b.i).slice(0,N).filter(c=>c.v>0);
  const cand=new Set(pv.map(c=>c.t));
  m.next.promises=m.next.promises.filter(p=>!cand.has(p)).concat(top.map(c=>c.t));
  m.updatedAt=Date.now(); state.promiseTab="list"; saveNow(); render();
  toast(`약속 ${top.length}개를 정했습니다`);
}

function addCandidate(t){
  const m=current(); const v=String(t||"").trim(); if(!v) return;
  m.goalVote=m.goalVote||[];
  if(m.goalVote.some(c=>c.t===v)){ toast("이미 올라온 후보입니다"); return; }
  if(m.goalVote.length>=8){ toast("후보는 8개까지 넣을 수 있습니다"); return; }
  m.goalVote.push({t:v,v:0}); m.updatedAt=Date.now(); save(); render();
  const i=$("#add-cand"); if(i){ i.value=""; i.focus(); }
}

function bumpGoal(i,d){
  const m=current(); const gv=m.goalVote||[]; if(!gv[i]) return;
  gv[i].v=Math.max(0,(gv[i].v||0)+d); m.updatedAt=Date.now(); save(); paintGoal();
}

/* 표를 셀 때마다 화면 전체를 다시 그리면 깜빡이므로 표결 부분만 갈아 끼운다 */
function paintGoal(){
  const m=current(), wrap=$("#gvwrap");
  if(wrap) wrap.innerHTML=goalVoteHTML(m);
  const rail=railBtn("goal");
  if(rail) rail.classList.toggle("filled",stepFilled(m,"goal"));
}

/* ---------- 패들렛으로 학생 의견 받기 ----------
   앱은 서버가 없어 학생 폰과 칠판이 직접 이어질 수 없다. 그래서 모으는 일은 패들렛에 맡기고,
   앱은 QR로 패들렛을 열어 주고, 모인 글을 붙여넣기로 받아 선생님이 거른 것만 넣는다. */
const PADLET_CTX={
  ice:    {name:"오늘의 질문 답",  sec:"놀이", ask:()=>"화면의 질문에 대한 내 생각을 적어 주세요."},
  review: {name:"이번달 반성 의견", sec:"반성", ask:m=>m.review.topic
             ? `“${m.review.topic}”을(를) 이번 달에 얼마나 잘 지켰는지 내 생각을 적어 주세요.`
             : "이번 달 약속을 얼마나 잘 지켰는지 내 생각을 적어 주세요."},
  goal:   {name:"생활 목표 후보",  sec:"목표", ask:()=>"다음 달 우리 반이 지키면 좋을 생활 목표를 적어 주세요."},
  promise:{name:"다음달 실천내용", sec:"실천", ask:m=>m.next.topic
             ? `“${m.next.topic}” 목표를 지키려면 무엇을 하면 좋을지 적어 주세요.`
             : "다음 달 목표를 지키기 위해 할 수 있는 일을 적어 주세요."},
  suggest:{name:"건의사항",        sec:"건의", ask:()=>"학교생활에서 불편한 점이나 바라는 점을 적어 주세요."}
};

/* 주소를 https:// 없이 붙여넣으면 휴대폰이 QR을 글자로만 읽으므로 붙여 준다 */
function padletUrl(){
  let u=String(db.settings.padletUrl||"").trim();
  if(u&&!/^https?:\/\//i.test(u)) u="https://"+u;
  return u;
}

/* ---------- 구글 설문지 ----------
   학생은 설문지로 내고, 앱은 응답 시트를 읽는다. 계정이 없는 선생님도 파일·GitHub에서 자동으로 가져올 수 있다.
   설문지의 '어디에 낼 의견인가요?' 보기는 아래 글자와 똑같아야 화면마다 나뉜다. */
const GFORM_LABEL={ice:"여는 놀이", review:"이번달 반성", goal:"생활 목표", promise:"실천내용", suggest:"건의사항"};
const useGform=()=>db.settings.source==="gform";
/* 앱 링크(claude.ai) 안에서는 외부 스크립트가 막혀 응답 시트를 읽을 수 없다 */
const inArtifact=()=>!!window.claude;

function gformSheetId(){
  const m=String(db.settings.gformSheet||"").match(/\/spreadsheets\/d\/([A-Za-z0-9_-]{20,})/);
  return m?m[1]:"";
}
/* '미리 채워진 링크'를 넣어 두면 화면마다 그 칸을 골라 둔 설문지를 연다. 일반 링크면 학생이 칸을 고른다 */
function gformPrefill(){
  const raw=String(db.settings.gformLink||"").trim(); if(!raw) return null;
  try{
    const u=new URL(/^https?:\/\//i.test(raw)?raw:"https://"+raw);
    const entry=[...u.searchParams.keys()].find(k=>/^entry\.\d+$/.test(k));
    return {href:u.href, base:u.origin+u.pathname, entry:entry||null};
  }catch(e){ return {href:raw, base:raw, entry:null}; }
}
function formLinkFor(kind){
  const p=gformPrefill(); if(!p) return "";
  if(!p.entry) return p.href;
  return `${p.base}?usp=pp_url&${p.entry}=${encodeURIComponent(GFORM_LABEL[kind]||"")}`;
}
/* 학생 휴대폰이 열 주소 — 설정에서 고른 쪽 */
function studentUrl(kind){ return useGform()?formLinkFor(kind):padletUrl(); }

function qrHTML(m){
  if(!state.qrOpen) return "";
  const kind=state.qrFor, url=studentUrl(kind), ctx=PADLET_CTX[kind]||PADLET_CTX.suggest;
  const g=useGform(), pick=g&&!(gformPrefill()||{}).entry;
  /* 미리 채워진 링크가 아니면, 설문지가 칸을 고르는 모양인지 질문이 나뉜 모양인지 모르므로 둘 다 맞는 말로 */
  const ask=pick ? `설문지를 열어 ‘${GFORM_LABEL[kind]}’에 대한 의견을 적어 주세요.` : ctx.ask(m);
  return `<div class="drawwrap">
    <div class="drawbox" style="max-width:44ch">
      <div class="eyebrow">휴대폰으로 의견 내기 · ${esc(ctx.name)}</div>
      ${url?`
        <div class="qrbox" id="qrbox"></div>
        <p class="drawmeta">${esc(ask)}</p>
        <p class="qrurl">${esc(url)}</p>`
      :`<p class="lead">설정에서 ${g?"구글 설문지 링크":"우리 반 패들렛 주소"}를 먼저 넣어 주세요.</p>
        <button class="b-btn draw-go" data-act="settings">설정 열기</button>`}
      <button class="b-btn drawclose" data-act="qr-close">닫기 (Esc)</button>
    </div>
  </div>`;
}

/* QR 라이브러리는 QR을 처음 띄울 때만 불러온다. 패들렛 자체가 인터넷이 있어야 되므로 여기서 인터넷을 요구해도 잃는 것이 없다 */
let qrLib=null;
function loadQRLib(){
  if(window.QRCode) return Promise.resolve();
  if(qrLib) return qrLib;
  qrLib=new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";
    s.onload=res; s.onerror=()=>{ qrLib=null; rej(); };
    document.head.appendChild(s);
  });
  return qrLib;
}
function drawQR(url,px){
  const box=$("#qrbox"); if(!box||!url) return;
  box.innerHTML=`<p style="color:#555;font-size:14px;padding:40px 20px;line-height:1.5">QR을 만드는 중…</p>`;
  loadQRLib().then(()=>{
    const b=$("#qrbox"); if(!b) return;
    b.innerHTML="";
    const size=px?Math.max(170,px):Math.max(200,Math.min(460,Math.floor(Math.min(innerWidth,innerHeight)*.46)));
    new window.QRCode(b,{text:url,width:size,height:size,
      colorDark:"#000000",colorLight:"#ffffff",correctLevel:window.QRCode.CorrectLevel.M});
  }).catch(()=>{
    const b=$("#qrbox");
    if(b) b.innerHTML=`<p style="color:#555;font-size:14px;padding:30px 20px;line-height:1.5;max-width:22em">
      QR을 불러오지 못했습니다. 인터넷 연결을 확인하거나, 아래 주소를 칠판에 적어 주세요.</p>`;
  });
}

/* ---------- 앱 안의 의견함 (Firebase) ----------
   학생 폰(s.html)은 Firestore 에 글을 쓰기만 하고, 칠판은 onSnapshot 으로 실시간으로 받는다.
   앱 링크(claude.ai)는 외부 연결이 막혀 있어 GitHub 주소·파일에서만 켜진다.
   글을 읽고 지우는 권한은 의견함을 만든 칠판(익명 로그인)에만 있다 — firestore.rules 참고. */
const LIVE=__FB_CONFIG__;
const STUDENT_URL="__STUDENT_URL__";
const useLive=()=>!!LIVE&&db.settings.source==="live"&&!inArtifact();
const live={fs:null, uid:null, code:null, unsub:null, items:[], kind:"", ask:"", open:false, err:"", off:new Set(), on:new Set(), shown:new Set()};
const liveUrl=()=>`${STUDENT_URL}?r=${live.code}`;

/* 패들렛이 안 쓰이는 처음 사용자는 앱 안의 의견함으로 시작한다 */
function liveMigrate(){
  const s=db.settings; if((s.liveVer||0)>=1) return;
  if(LIVE&&!inArtifact()&&s.source==="padlet"&&!String(s.padletUrl||"").trim()) s.source="live";
  s.liveVer=1;
}

let fbLoad=null;
function loadFirebase(){
  if(fbLoad) return fbLoad;
  const V="10.14.1", add=n=>new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src=`https://www.gstatic.com/firebasejs/${V}/firebase-${n}-compat.js`;
    s.onload=res; s.onerror=()=>rej({code:"load"}); document.head.appendChild(s);
  });
  fbLoad=(async()=>{
    await add("app"); await Promise.all([add("auth"),add("firestore")]);
    firebase.initializeApp(LIVE);
    const auth=firebase.auth(), fs=firebase.firestore();
    if(LIVE.emu){ auth.useEmulator(`http://${LIVE.emu}:9099`); fs.useEmulator(LIVE.emu,8080); }
    /* 익명 로그인 — 이 브라우저를 의견함 주인으로 알아보는 데만 쓴다 */
    let u=await new Promise(r=>{ const off=auth.onAuthStateChanged(x=>{ off(); r(x); }); });
    if(!u) u=(await auth.signInAnonymously()).user;
    live.fs=fs; live.uid=u.uid;
  })().catch(e=>{ fbLoad=null; throw e; });
  return fbLoad;
}
function liveErrText(e){
  const c=e&&e.code||"";
  if(c==="load") return "Firebase를 불러오지 못했습니다. 인터넷 연결과 학교망 차단 여부를 확인해 주세요.";
  if(c==="auth/admin-restricted-operation"||c==="auth/operation-not-allowed"||c==="auth/configuration-not-found") return "Firebase에서 익명 로그인이 꺼져 있습니다. Authentication의 ‘익명’을 켜 주세요.";
  if(c==="permission-denied") return "의견함을 만들 권한이 없습니다. Firebase 규칙을 확인해 주세요.";
  if(c==="unavailable"||c==="auth/network-request-failed") return "서버에 연결하지 못했습니다. 인터넷 연결을 확인해 주세요.";
  return "의견함을 열지 못했습니다"+(e&&e.message?` (${e.message})`:"")+".";
}
/* 여는 놀이는 칠판에 떠 있는 질문을 그대로 학생 폰에 보여 준다 */
function liveCtx(m,kind){
  const ctx=PADLET_CTX[kind]; let ask=ctx.ask(m);
  if(kind==="ice"&&state.iceMode==="q"){
    const qs=db.settings.questions||[]; if(qs.length) ask=qs[(state.iceQ||0)%qs.length];
  }
  return {kind, label:ctx.name, ask};
}
function newRoomCode(){
  const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789", b=crypto.getRandomValues(new Uint8Array(6));
  return Array.from(b,x=>A[x%A.length]).join("");
}
async function liveStart(){
  const m=current(), kind=steps()[state.step].id;
  state.liveOpen=true; live.err=""; render();
  try{
    await loadFirebase();
    const rooms=live.fs.collection("rooms"), want=liveCtx(m,kind);
    let code=m.liveCode;
    if(code){ try{ await rooms.doc(code).update({...want,open:true}); }catch(e){ code=null; } }
    if(!code){
      code=newRoomCode();
      await rooms.doc(code).set({owner:live.uid,...want,open:true,at:Date.now()});
      m.liveCode=code; m.updatedAt=Date.now();
      db.settings.liveRooms=(db.settings.liveRooms||[]).concat({code,at:Date.now()});
      saveNow();
    }
    Object.assign(live,want,{open:true});
    if(live.code!==code){
      if(live.unsub) live.unsub();
      live.code=code; live.items=[]; live.off.clear(); live.on.clear(); live.shown.clear();
      live.unsub=rooms.doc(code).collection("items").orderBy("at").onSnapshot(sn=>{
        live.items=sn.docs.map(d=>Object.assign({id:d.id},d.data()));
        paintLive();
      },e=>{ live.err=liveErrText(e); paintLive(); });
    }
    if(state.liveOpen) render();
    liveCleanup();
  }catch(e){ live.err=liveErrText(e); if(state.liveOpen) render(); }
}
/* 칠판 화면이 바뀌면 학생 폰의 질문도 따라 바뀌게 하고, 회의에서 나가면 의견함을 닫는다 */
function liveSync(){
  if(!live.code||!live.fs||!live.open) return;
  const room=live.fs.collection("rooms").doc(live.code), m=current();
  if(state.view!=="run"||!m){
    live.open=false; room.update({open:false}).catch(()=>{});
    if(live.unsub) live.unsub();
    Object.assign(live,{unsub:null,code:null,items:[]});
    return;
  }
  const id=(steps()[state.step]||{}).id; if(!PADLET_CTX[id]) return;
  const w=liveCtx(m,id); if(w.kind===live.kind&&w.ask===live.ask) return;
  Object.assign(live,w); room.update(w).catch(()=>{});
}
/* 하루 지난 의견함은 다음에 의견함을 열 때 통째로 지운다 */
async function liveDeleteRoom(code){
  const room=live.fs.collection("rooms").doc(code), sn=await room.collection("items").get(), b=live.fs.batch();
  sn.docs.forEach(d=>b.delete(d.ref)); b.delete(room); await b.commit();
}
async function liveCleanup(){
  const s=db.settings, old=(s.liveRooms||[]).filter(r=>Date.now()-r.at>864e5&&r.code!==live.code);
  for(const r of old){
    try{ await liveDeleteRoom(r.code); }catch(e){}
    s.liveRooms=s.liveRooms.filter(x=>x.code!==r.code);
    db.meetings.forEach(x=>{ if(x.liveCode===r.code) delete x.liveCode; });
  }
  if(old.length) save();
}
const LIVE_BAD=/시발|씨발|ㅅㅂ|ㅆㅂ|병신|ㅂㅅ|개새|존나|ㅈㄴ|지랄|ㅈㄹ|꺼져|닥쳐|새끼/;
const LIVE_JOKE=/^[ㄱ-ㅎㅏ-ㅣ\s!?.~^;]+$/;
/* 지금 화면의 의견 + 넣을지 여부. 거친 말·장난 글은 칠판에 그대로 띄우지 않고 가려 둔다 */
function liveList(kind){
  const m=current(), have=new Set(importTarget(m,kind)), seen=new Set(), out=[];
  live.items.filter(x=>x.k===kind).forEach(x=>{
    const t=String(x.t||"").replace(/\s+/g," ").trim(); if(!t) return;
    const dup=have.has(t)||seen.has(t); seen.add(t);
    const rough=LIVE_BAD.test(t.replace(/\s/g,""))||LIVE_JOKE.test(t);
    const hidden=rough&&!live.shown.has(x.id);
    const on=live.on.has(x.id)||(!live.off.has(x.id)&&!dup&&!rough);
    out.push({id:x.id,t,dup,rough,hidden,on});
  });
  return out;
}
function paintLive(){
  const id=state.view==="run"?(steps()[state.step]||{}).id:null;
  const badge=$("#live-badge");
  if(badge&&PADLET_CTX[id]){
    const n=live.items.filter(x=>x.k===id).length;
    badge.textContent=n; badge.hidden=!n;
  }
  const el=$("#livecards"); if(!el) return;
  const list=liveList(id), on=list.filter(x=>x.on).length;
  el.innerHTML=list.length?list.map(x=>`<div class="livecard${x.on?" on":""}${x.dup?" dup":""}">
      <button class="livepick" data-act="live-tog" data-id="${esc(x.id)}" aria-pressed="${x.on}">
        ${x.hidden?`<em>가려진 글 · 눌러서 보기</em>`:esc(x.t)}${x.dup&&!x.hidden?`<small>이미 있음</small>`:""}</button>
      <button class="livex" data-act="live-del" data-id="${esc(x.id)}" aria-label="이 글 지우기">×</button>
    </div>`).join(""):`<p class="liveempty">아직 도착한 의견이 없습니다.<br>QR을 찍어 보내 보세요.</p>`;
  const c=$("#live-n"); if(c) c.textContent=`도착한 의견 ${list.length}개`;
  const b=$("#live-apply");
  if(b){ b.textContent=`고른 ${on}개 넣기`; b.disabled=!on; }
  const er=$("#live-err"); if(er){ er.textContent=live.err; er.hidden=!live.err; }
}

function liveApply(){
  const kind=steps()[state.step].id, picked=liveList(kind).filter(x=>x.on);
  if(!picked.length) return;
  /* 거친 말은 눌러서 내용을 본 뒤에만 고를 수 있으므로 여기서는 그대로 넣는다 */
  Object.assign(state,{impFor:kind, impItems:picked.map(x=>({t:x.t,on:true})), liveOpen:false});
  applyImport();
  const b=live.fs.batch(), col=live.fs.collection("rooms").doc(live.code).collection("items");
  picked.forEach(x=>{ b.delete(col.doc(x.id)); live.on.delete(x.id); });
  b.commit().catch(()=>{});
}

        ${state.impErr?`<p class="imp-err" role="alert">${esc(state.impErr)}</p>`:""}

/* ---------- 패들렛에서 바로 읽어 오기 (앱 링크에서만) ----------
   선생님 claude.ai 계정의 'Padlet MCP' 연결을 통해 읽는다. 내려받은 파일·GitHub 주소에는
   window.claude 가 없어 mcpNS 가 null 로 남고, 붙여넣기만 보인다. */
const PADLET_SERVER="Padlet MCP";
let mcpNS=null;
(async()=>{
  try{
    if(window.claude&&typeof window.claude.use==="function"){
      mcpNS=await window.claude.use("mcp");
      if(mcpNS&&state.impOpen) render();
    }
  }catch(e){ mcpNS=null; }
})();

/* 칸 이름으로 화면을 찾는다. 선생님 패들렛: '회의 중 여는 놀이' '생활 목표' '실천내용' '건의사항' */
/* 칸·질문 이름으로 어느 화면의 의견인지 정한다. 순서가 중요하다:
   '이번달 실천내용 반성하기'는 '실천'이 들어가도 반성 화면이므로 반성을 가장 먼저 본다 */
function screenFromLabel(s){
  s=String(s||"");
  if(/반성|이번\s*달|지난\s*달/.test(s)) return "review";
  if(/놀이|질문|여는|아이스/.test(s)) return "ice";
  if(/목표|후보/.test(s)) return "goal";
  if(/실천|약속/.test(s)) return "promise";
  if(/건의|바라|불편/.test(s)) return "suggest";
  return null;
}

/* 글 본문은 HTML로 온다. DOMParser 로 만든 문서는 스크립트·이미지가 돌지 않아 학생 글을 안전하게 풀 수 있다 */
function htmlText(h){
  if(!h) return "";
  const s=String(h).replace(/<br\s*\/?>/gi,"\n").replace(/<\/(p|div|li|h\d)>/gi,"\n");
  const doc=new DOMParser().parseFromString(s,"text/html");
  return (doc.body.textContent||"").split("\n")
    .map(x=>x.replace(/ /g," ").replace(/\s+/g," ").trim()).filter(Boolean).join(" ");
}
function localDay(iso){
  const d=new Date(iso); if(isNaN(d)) return "";
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
/* 같은 패들렛을 매달 다시 쓰면 지난달 글이 남아 있다. 지난 회의 날짜까지 올라온 글은 '지난 회의'로 본다 */
function prevMeetingDate(m){
  const ds=db.meetings.filter(x=>x.id!==m.id&&x.date&&x.date<m.date).map(x=>x.date).sort();
  return ds.length?ds[ds.length-1]:null;
}
function padletData(payload){
  let p=payload;
  if(typeof p==="string"){ try{ p=JSON.parse(p); }catch(e){ return null; } }
  if(!p||p.success===false) return null;
  const c=p.padlet&&p.padlet.padlet_content;
  if(!c||!Array.isArray(c.posts)) return null;
  return {sections:Array.isArray(c.sections)?c.sections:[], posts:c.posts};
}
/* 오류마다 고칠 방법이 다르므로 한 문구로 뭉치지 않는다 */
function mcpErrText(err){
  switch(err&&err.code){
    case "needs_reauth": return "패들렛 연결이 끊겼습니다. claude.ai 설정 → 커넥터에서 Padlet MCP를 다시 연결해 주세요.";
    case "server_not_connected":
    case "server_not_found": return "이 계정에 패들렛이 연결돼 있지 않습니다. claude.ai 설정 → 커넥터에서 Padlet MCP를 추가해 주세요.";
    case "selection_required": return "패들렛 연결이 두 개 이상입니다. 화면 위쪽 안내에서 쓸 연결을 하나 골라 주세요.";
    case "tool_error": return "패들렛을 읽지 못했습니다. 설정의 패들렛 주소가 맞는지, 이 계정으로 볼 수 있는 패들렛인지 확인해 주세요.";
    case "server_unavailable":
    case "rate_limited": return "패들렛이 잠시 응답하지 않습니다. 조금 뒤 다시 눌러 주세요.";
    case "not_in_manifest": case "blocked_by_policy": case "approval_required":
      return "학교 계정 정책 때문에 패들렛 연결을 쓸 수 없습니다. 복사해서 붙여넣기로 가져와 주세요.";
    case "not_granted": case "capability_disabled": case "capability_removed":
      return "이 화면에서는 패들렛 연결을 쓸 수 없습니다. 복사해서 붙여넣기로 가져와 주세요.";
    case "cancelled": return "";
    default: return "패들렛을 불러오지 못했습니다"+(err&&err.message?` (${err.message})`:"")+". 복사해서 붙여넣기로 가져와 주세요.";
  }
}

/* 지금 쓸 수 있는 자동 가져오기 — 없으면 null(붙여넣기만) */
function autoSource(){
  if(useGform()) return (gformSheetId()&&!inArtifact())?"gform":null;
  return (mcpNS&&padletUrl())?"padlet":null;
}

/* 두 출처가 함께 쓰는 마무리: 겹침·장난·지난 회의 표시를 붙여 체크 목록으로 */
function showImported(m,kind,texts,meta){
  const have=new Set(importTarget(m,kind)), prev=prevMeetingDate(m);
  const jokeRe=/^[ㄱ-ㅎㅏ-ㅣ\s!?.~^;]+$/, seen=new Set(), items=[];
  for(const {t:raw,day} of texts){
    const t=String(raw||"").replace(/\s+/g," ").trim().slice(0,200);
    if(!t||seen.has(t)) continue;
    seen.add(t);
    const dup=have.has(t), joke=jokeRe.test(t), old=!!(prev&&day&&day<=prev);
    items.push({t, dup, joke, old, on:!dup&&!joke&&!old});
  }
  state.impItems=items;
  state.impSrc=Object.assign({auto:true, total:items.length}, meta);
  render();
}

function autoImport(){
  if(state.impBusy) return;
  const via=autoSource();
  if(via==="gform") return gformImport();
  if(via==="padlet") return padletImport();
  if(useGform()&&inArtifact()){
    state.impErr="앱 링크(claude.ai)에서는 구글 설문지를 읽을 수 없습니다. 내려받은 파일이나 GitHub 주소로 열어 주세요.";
    render();
  }
}

/* ---------- 구글 설문지 응답 시트 읽기 ----------
   보통의 fetch 는 구글이 막는다(CORS). 스크립트로 불러오는 JSONP 는 파일·GitHub 어디서나 된다.
   시트가 '링크가 있는 모든 사용자 · 뷰어'로 공유돼 있어야 하고, 아니면 스크립트 오류로 바로 끝난다. */
let gvizSeq=0;
function gvizLoad(sheetId){
  return new Promise((res,rej)=>{
    const cb="__jhGviz"+(++gvizSeq), s=document.createElement("script");
    const done=()=>{ clearTimeout(timer); try{ delete window[cb]; }catch(e){ window[cb]=undefined; } s.remove(); };
    const timer=setTimeout(()=>{ done(); rej({code:"timeout"}); },15000);
    window[cb]=j=>{ done();
      if(j&&j.status==="error"){
        const e=(j.errors||[])[0]||{};
        rej({code:"sheet", message:e.detailed_message||e.message||""});
      } else res(j);
    };
    s.onerror=()=>{ done(); rej({code:"load"}); };
    s.src=`https://docs.google.com/spreadsheets/d/${encodeURIComponent(sheetId)}/gviz/tq`
      +`?tqx=out:json;responseHandler:${cb}&headers=1&_=${Date.now()}`;
    document.head.appendChild(s);
  });
}
function gvizCell(x){ return x==null?null:(x.v!=null?x.v:(x.f!=null?x.f:null)); }
/* 응답 시각은 "Date(2026,8,30,10,22,37)" 모양이고 달은 0부터 센다 */
function gvizDay(v){
  const m=typeof v==="string"&&v.match(/^Date\((\d+),(\d+),(\d+)/);
  return m?`${m[1]}-${String(+m[2]+1).padStart(2,"0")}-${String(m[3]).padStart(2,"0")}`:"";
}
/* 설문지는 두 가지 모양이 있다.
   ① 화면마다 질문을 하나씩 — 질문 제목(예: '여는 놀이 발표하기')으로 화면을 정한다. 아이들이 쓰기 가장 쉽다.
   ② 객관식으로 칸을 고르고 의견 하나 — 고른 값으로 화면을 정한다.
   값만 보고 칸의 역할을 알아내므로, 선생님이 질문 제목을 자유롭게 지어도 된다. */
function gformTable(j){
  const t=j&&j.table; if(!t||!Array.isArray(t.cols)) return null;
  let labels=t.cols.map(c=>String(c.label||"").trim());
  let rows=(t.rows||[]).map(r=>(r.c||[]).map(gvizCell));
  if(labels.every(l=>!l)&&rows.length){ labels=rows[0].map(v=>String(v??"").trim()); rows=rows.slice(1); }
  const tsCol=labels.findIndex((_,i)=>rows.some(r=>gvizDay(r[i])));
  const textVals=i=>rows.map(r=>r[i]).filter(v=>typeof v==="string"&&v.trim());
  const isEmail=i=>{ const v=textVals(i); return v.length>0&&v.every(x=>/^[^\s@]+@[^\s@]+$/.test(x)); };
  /* 값이 대부분 '여는 놀이·건의사항…' 같은 칸 이름이고 가짓수가 적으면 ②의 분류 칸이다 */
  const isCatCol=i=>{
    const v=textVals(i); if(!v.length) return false;
    const hit=v.filter(x=>x.length<=10&&screenFromLabel(x)).length;
    return new Set(v).size<=6 && hit>=v.length*0.8;
  };
  const cols=labels.map((_,i)=>i).filter(i=>i!==tsCol&&!isEmail(i));
  const catCol=cols.find(isCatCol) ?? -1;

  /* ① 질문 제목으로 화면이 정해지는 칸들 */
  const topicCols={};
  if(catCol<0) cols.forEach(i=>{
    const k=screenFromLabel(labels[i]);
    if(k) (topicCols[k]=topicCols[k]||[]).push(i);
  });
  /* ② 분류 칸 옆의 의견 칸 = 글이 가장 긴 칸 */
  let opCol=-1, bestLen=0;
  cols.forEach(i=>{
    if(i===catCol) return;
    const L=textVals(i).reduce((a,v)=>a+v.length,0);
    if(L>bestLen){ bestLen=L; opCol=i; }
  });
  return {labels, rows, tsCol, catCol, opCol, topicCols};
}
function gformErrText(err){
  switch(err&&err.code){
    case "load": case "timeout":
      return "응답 시트를 읽지 못했습니다. ① 시트 공유가 ‘링크가 있는 모든 사용자 · 뷰어’인지 ② 설정의 ‘응답 시트 주소’가 설문지가 아닌 시트 주소인지 ③ 인터넷 연결을 확인해 주세요.";
    case "sheet": return "응답 시트를 읽지 못했습니다"+(err.message?` (${err.message})`:"")+".";
    default: return "응답 시트를 읽지 못했습니다. 복사해서 붙여넣기로 가져와 주세요.";
  }
}
async function gformImport(){
  const m=current(), kind=state.impFor, id=gformSheetId();
  Object.assign(state,{impBusy:true, impErr:""}); render();
  let j;
  try{ j=await gvizLoad(id); }
  catch(err){ Object.assign(state,{impBusy:false, impErr:gformErrText(err)}); if(state.impOpen) render(); return; }
  state.impBusy=false;
  if(!state.impOpen||state.impFor!==kind) return;
  const tb=gformTable(j);
  const day=r=>tb.tsCol>=0?gvizDay(r[tb.tsCol]):"";
  const ctx=PADLET_CTX[kind]||{};
  if(!tb){ state.impErr="응답 시트를 알아보지 못했습니다. 복사해서 붙여넣기로 가져와 주세요."; render(); return; }

  if(tb.catCol>=0&&tb.opCol>=0){                               /* ② 칸을 고르는 설문지 */
    const rows=tb.rows.filter(r=>screenFromLabel(r[tb.catCol])===kind);
    return showImported(m,kind, rows.map(r=>({t:r[tb.opCol], day:day(r)})),
      {via:"gform", sec:GFORM_LABEL[kind]});
  }
  if(Object.keys(tb.topicCols).length){                        /* ① 화면마다 질문이 있는 설문지 */
    const cs=tb.topicCols[kind]||[];
    if(!cs.length){
      state.impErr=`설문지에 이 화면(${ctx.name})에 맞는 질문이 없습니다. 질문 제목에 ‘${ctx.sec}’이(가) 들어가게 하면 여기로 가져옵니다.`;
      render(); return;
    }
    const texts=[];
    tb.rows.forEach(r=>cs.forEach(i=>{ if(r[i]!=null&&String(r[i]).trim()) texts.push({t:r[i], day:day(r)}); }));
    return showImported(m,kind,texts,{via:"gform", sec:cs.map(i=>tb.labels[i]).join(", "), q:true});
  }
  if(tb.opCol>=0){                                             /* 구분 없는 설문지 — 전부 */
    return showImported(m,kind, tb.rows.map(r=>({t:r[tb.opCol], day:day(r)})), {via:"gform", sec:null});
  }
  state.impErr="응답 시트에서 의견 칸을 찾지 못했습니다. 설문지에 글로 답하는 질문이 있는지 확인해 주세요.";
  render();
}

async function padletImport(){
  const m=current(), kind=state.impFor, url=padletUrl();
  if(!mcpNS||!url) return;
  Object.assign(state,{impBusy:true, impErr:""}); render();
  const call=()=>mcpNS.callTool(PADLET_SERVER,"get_padlet_content",{wall_url:url},{cache:false});
  let res;
  try{
    try{ res=await call(); }
    catch(err){                                /* 잠깐 끊긴 경우만 한 번 더 */
      if(!(err&&err.retryable)) throw err;
      await new Promise(r=>setTimeout(r,(err.retryAfterMs||800)+Math.random()*800));
      res=await call();
    }
  }catch(err){
    const code=err&&err.code;
    if(code==="not_granted"||code==="capability_disabled"||code==="capability_removed") mcpNS=null;
    Object.assign(state,{impBusy:false, impErr:mcpErrText(err)});
    if(state.impOpen) render();
    return;
  }
  state.impBusy=false;
  if(!state.impOpen||state.impFor!==kind){ return; }   /* 그새 창을 닫았거나 화면을 옮겼다 */
  const data=padletData(res&&res.payload);
  if(!data){ state.impErr="패들렛 내용을 알아보지 못했습니다. 복사해서 붙여넣기로 가져와 주세요."; render(); return; }

  const secs=data.sections.filter(s=>screenFromLabel(s.section_title)===kind);
  const secIds=new Set(secs.map(s=>String(s.section_id)));
  let posts=data.posts.filter(p=>p&&p.is_published!==false);
  /* 칸이 나뉜 패들렛인데 이 화면 칸만 없으면, 다른 칸 글을 쏟아 넣지 않고 알려 준다 */
  if(data.sections.length&&!secIds.size){
    const ctx=PADLET_CTX[kind]||{};
    state.impErr=`패들렛에 이 화면(${ctx.name})에 맞는 칸이 없습니다. 칸 이름에 ‘${ctx.sec}’이(가) 들어가게 하면 여기로 가져옵니다.`;
    render(); return;
  }
  if(secIds.size) posts=posts.filter(p=>secIds.has(String(p.section_id)));

  /* 본문을 쓰고, 본문이 비었으면 제목을 쓴다. 작성자 이름은 칠판에 띄우지 않는다 */
  showImported(m,kind,
    posts.map(p=>({t:htmlText(p.body)||String(p.subject||""), day:p.published_at?localDay(p.published_at):""})),
    {via:"padlet", sec:secIds.size?secs.map(s=>s.section_title).join(", "):null});
}

/* 패들렛에서 복사하면 글마다 '작성자 → 시간 → 본문 → 좋아요' 순서로 딸려 온다.
   시간·좋아요·익명처럼 확실한 잡음은 버린다.
   작성자 이름은 글자 수로는 가릴 수 없다('축구' '떡볶이' 같은 짧은 답이 흔하다). 그래서
   '시간 줄 바로 앞에 오는 짧은 한글 줄'만 이름으로 보고 체크를 풀어 둔다.
   시간이 아예 안 보이게 설정된 패들렛이면 가장 흔한 3글자 이름만 의심한다. */
function parsePasted(text){
  const TIME="(방금|just now|\\d+\\s*(초|분|시간|일|주|개월|년)\\s*전|\\d+\\s*(sec|min|hour|day|week|month|year)s?\\s*ago"
    +"|\\d{1,2}:\\d{2}(\\s*[ap]m)?|\\d{4}[.\\-/]\\s*\\d{1,2}[.\\-/]\\s*\\d{1,2}.*)";
  const timeRe=new RegExp("^"+TIME+"$","i");
  const noise=new RegExp("^(" + [
    "익명","anonymous", TIME,
    "(좋아요|댓글|답글|likes?|comments?|repl(y|ies))\\s*\\d*",
    "\\d+\\s*(좋아요|댓글|답글|likes?|comments?)",
    "[가-힣A-Za-z]{1,10}\\s*[·•|]\\s*"+TIME,          /* '김민준 · 2분 전' 처럼 한 줄에 붙은 경우 */
    "[\\d\\s]+"
  ].join("|") + ")$","i");
  const jokeRe=/^[ㄱ-ㅎㅏ-ㅣ\s!?.~^;]+$/;               /* ㅋㅋㅋ ㅎㅎ ㅠㅠ 처럼 자모만 있는 줄 */
  const clean=l=>l.replace(/^\s*([-*•·▪◦►]|\d+[.)]|\(\d+\))\s*/,"").replace(/\s+/g," ").trim();
  const lines=String(text||"").split(/\r?\n/).map(clean).filter(Boolean);
  const hasTime=lines.some(l=>timeRe.test(l));
  const seen=new Set(), out=[];
  lines.forEach((t,i)=>{
    if(t.length<2||noise.test(t)||seen.has(t)) return;
    const name=hasTime
      ? /^[가-힣]{2,4}$/.test(t) && timeRe.test(lines[i+1]||"")
      : /^[가-힣]{3}$/.test(t);
    seen.add(t); out.push({t, name, joke:jokeRe.test(t)});
  });
  return out;
}

function importTarget(m,kind){
  if(kind==="suggest") return m.suggestions;
  if(kind==="promise") return (m.promiseVote||[]).map(c=>c.t).concat(m.next.promises);
  if(kind==="ice") return (m.iceAnswers=m.iceAnswers||[]);
  if(kind==="review") return (m.reviewNotes=m.reviewNotes||[]);
  if(kind==="goal") return (m.goalVote||[]).map(c=>c.t);
  return [];
}

function applyImport(){
  const m=current(), kind=state.impFor;
  const picked=(state.impItems||[]).filter(x=>x.on).map(x=>x.t);
  let n=0;
  if(kind==="goal"||kind==="promise"){              /* 학생 의견은 투표 후보가 된다 */
    const key=kind==="goal"?"goalVote":"promiseVote", cap=kind==="goal"?8:9;
    m[key]=m[key]||[];
    for(const t of picked){
      if(m[key].length>=cap) break;
      if(!m[key].some(c=>c.t===t)){ m[key].push({t,v:0}); n++; }
    }
  }else{
    const arr=importTarget(m,kind);
    for(const t of picked) if(!arr.includes(t)){ arr.push(t); n++; }
  }
  m.updatedAt=Date.now(); saveNow();
  Object.assign(state,{impOpen:false,impItems:null});
  if(kind==="promise"&&n) state.promiseTab="vote";
  if(kind==="review"&&n) state.reviewTab="notes";          /* 넣은 반성 의견을 바로 보여 준다 */
  if(kind==="ice"&&n) state.iceMode="q";                   /* 여는 놀이 답은 '오늘의 질문' 아래에 뜬다 */
  render();
  const skipped=picked.length-n;
  toast(n?`${n}개를 넣었습니다`+(skipped?` (겹치거나 자리가 없어 ${skipped}개는 뺐습니다)`:""):"새로 넣을 의견이 없었습니다");
}

const MISS_POOL=[["🍎","사과"],["🍌","바나나"],["🍉","수박"],["🍓","딸기"],["🍇","포도"],["🥕","당근"],["🍞","빵"],
  ["🍩","도넛"],["🍦","아이스크림"],["🍕","피자"],["🐶","강아지"],["🐱","고양이"],["🐰","토끼"],["🐻","곰"],
  ["🐼","판다"],["🐯","호랑이"],["🐸","개구리"],["🐧","펭귄"],["🦒","기린"],["🐘","코끼리"],["⚽","축구공"],

  ["🎸","기타"],["🎈","풍선"],["🎁","선물"],["📚","책"],["✏️","연필"],["✂️","가위"],["⏰","시계"],["☂️","우산"],
  ["👑","왕관"],["🌻","해바라기"],["🌈","무지개"],["⭐","별"],["🌙","달"],["☀️","해"]];
const RPS=[{e:"✌️",n:"가위"},{e:"✊",n:"바위"},{e:"🖐️",n:"보"}];

function shuffleArr(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* 효과음 — 앱 링크를 Claude 앱 안에서 열면 소리가 막히므로 조용히 넘어간다 */
let iceAudio=null;
function iceBeep(freq,dur,type){
  if(!db.settings.iceSound) return;
  try{
    if(!iceAudio){ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; iceAudio=new AC(); }
    if(iceAudio.state==="suspended") iceAudio.resume();
    const o=iceAudio.createOscillator(), g=iceAudio.createGain(), t=iceAudio.currentTime;
    o.type=type||"sine"; o.frequency.value=freq;
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.16,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(iceAudio.destination); o.start(t); o.stop(t+dur+.02);
  }catch(e){}
}

let iceTimer=null;
/* 진행 중인 카운트다운을 멈추고, 도중에 끊긴 놀이는 시작 전 상태로 되돌린다 */
function iceStop(){
  if(iceTimer){ clearInterval(iceTimer); clearTimeout(iceTimer); iceTimer=null; }
  if(state.rps.phase==="count") state.rps.phase=state.rps.round?"show":"idle";
  if(state.miss.phase==="show") state.miss.phase="idle";
  if(state.act.phase==="play") state.act.phase="setup";
  if(state.tele.phase==="count") state.tele.phase="topic";
}
const onIceSlide=()=>state.view==="run"&&(steps()[state.step]||{}).id==="ice";

function iceSlide(m){
  const mode=state.iceMode||"menu";
  if(mode==="menu") return `<h2>여는 놀이</h2>
    <p class="lead ice-sub">오늘은 어떤 놀이로 시작할까요?</p>
    <div class="icegrid">${ICE_GAMES.map(g=>`
      <button class="icegame" data-act="ice-go" data-k="${g.id}">
        <span class="ig-emo" aria-hidden="true">${g.emo}</span>
        <span class="ig-name">${esc(g.name)}</span>
        <span class="ig-desc">${esc(g.desc)}</span></button>`).join("")}</div>`;
  const g=ICE_GAMES.find(x=>x.id===mode)||ICE_GAMES[0];
  return `<div class="icehead">
      <button class="b-btn" data-act="ice-menu">← 놀이 고르기</button>
      <h2 class="iceh2"><span aria-hidden="true">${g.emo}</span> ${esc(g.name)}</h2>
    </div>

}

function iceBody(m,mode){
  const s=db.settings;
  switch(mode){
  case "q": {
    const qs=s.questions||[], q=qs.length?qs[(state.iceQ||0)%qs.length]:"", ans=m.iceAnswers||[];
    return `<div class="icecard big">${q?esc(q):`<span style="color:var(--chalk-3)">설정에서 질문을 넣어 주세요</span>`}</div>
      <div class="addrow">
        <button class="b-btn draw-go ice-primary" data-act="ice-next">다음 질문</button>
        <button class="b-btn" data-act="draw-open">번호 뽑아 발표하기</button>
      </div>
      ${ans.length?`<div class="iceans">${ans.map(a=>`<span class="iceans-i">${esc(a)}</span>`).join("")}</div>
        <div><button class="b-btn" data-act="ice-clear" style="font-size:.8rem">답 지우기</button></div>`:""}`;
  }
  case "cho": {
    const qz=s.quiz||[], raw=qz.length?qz[(state.iceC||0)%qz.length]:"";
    const [ans,hint]=String(raw).split("|"), word=(ans||"").trim(), shown=state.iceShow;
    const bits=[hint?"힌트 · "+esc(hint.trim()):"", word.replace(/\s/g,"").length+"글자",
      state.iceFirst&&!shown?`첫 글자 ‘${esc(word.charAt(0))}’`:""].filter(Boolean).join(" · ");
    return `<div class="icecho">${esc(toCho(word))}</div>
      <p class="lead ice-c">${bits}</p>
      <div class="icecard${shown?"":" veiled"}">${shown?esc(word):"정답 가림"}</div>
      <div class="addrow">
        <button class="b-btn draw-go ice-primary" data-act="ice-show">${shown?"다음 문제":"정답 보기"}</button>
        ${shown?"":`<button class="b-btn" data-act="ice-first"${state.iceFirst?" disabled":""}>첫 글자 힌트</button>`}
        <button class="b-btn" data-act="draw-open">번호 뽑기</button>
      </div>`;
  }
  case "bal": {
    const L=s.balance||[], raw=L.length?L[state.bal.i%L.length]:"왼쪽|오른쪽";
    const [A,B]=String(raw).split("|").map(x=>(x||"").trim());
    return `<div class="balwrap">
        ${balCard("a",A)}<div class="balvs">VS</div>${balCard("b",B)}
      </div>
      <div class="meter" id="bal-meter" role="img">${balMeter()}</div>
      <div class="meter-note"><span>1 키 · 왼쪽</span><span id="bal-tot">모두 ${state.bal.a+state.bal.b}명</span><span>2 키 · 오른쪽</span></div>
      <div class="addrow">
        <button class="b-btn draw-go" data-act="draw-open">번호 뽑아 이유 듣기</button>
        <button class="b-btn ice-primary" data-act="bal-next">다음 문제</button>
      </div>`;
  }
  case "rps": {
    const r=state.rps; let big;
    if(r.phase==="count") big=`<div class="rpscount" id="rps-word">${esc(r.word)}</div>`;
    else if(r.phase==="show"){
      const H=RPS[r.hand], W=RPS[(r.hand+1)%3];
      big=`<div class="rpsbig pop">${H.e}</div>
        <p class="rpsname">화면은 <b>${H.n}</b>!</p>
        <p class="lead ice-c"><b>${W.e} ${W.n}</b>를 낸 사람이 이겼어요. 진 사람과 비긴 사람은 앉아요.</p>`;
    } else big=`<div class="rpsbig">✌️ ✊ 🖐️</div>
        <p class="lead ice-c">모두 일어나세요! 화면과 가위바위보를 해요. 끝까지 서 있는 친구가 오늘의 첫 발표자!</p>`;
    return `<div class="icecenter">${big}</div>
      <div class="addrow" style="justify-content:center">
        <button class="b-btn draw-go ice-primary" data-act="rps-go"${r.phase==="count"?" disabled":""}>${r.round?"한 번 더!":"가위바위보!"}</button>
        ${r.round?`<span class="drawmeta">${r.round}판째</span><button class="b-btn" data-act="rps-reset">처음부터</button>`:""}
      </div>`;
  }
  case "ox": {
    const L=s.ox||[]; if(!L.length) return `<p class="lead">설정에서 OX 문제를 넣어 주세요.</p>`;
    const [q,a,ex]=String(L[state.ox.i%L.length]).split("|"), O=String(a||"").trim().toUpperCase()!=="X";
    return `<div class="icecard big">${esc((q||"").trim())}</div>
      ${state.ox.show
        ? `<div class="oxrow"><div class="oxans ${O?"o":"x"} pop">${O?"O":"X"}</div>${ex&&ex.trim()?`<p class="lead">${esc(ex.trim())}</p>`:""}</div>`
        : `<p class="lead ice-c">맞으면 두 팔로 <b>O</b>, 틀리면 <b>X</b>! 틀린 사람은 앉아요.</p>`}
      <div class="addrow" style="justify-content:center">
        <button class="b-btn draw-go ice-primary" data-act="ox-go">${state.ox.show?"다음 문제":"정답 보기"}</button>
        <span class="drawmeta">${state.ox.i%L.length+1} / ${L.length}</span>
      </div>`;
  }
  case "miss": return missBody();
  case "act":  return actBody();
  case "tele": return teleBody();
  }
  return "";
}

/* ---- 밸런스 게임 ---- */
function balCard(k,txt){
  const b=state.bal, v=b[k], lead=(b.a!==b.b)&&v===Math.max(b.a,b.b);
  return `<div class="balcard ${k}${lead?" lead":""}" id="bal-card-${k}">
    <div class="baltxt">${esc(txt)}</div>
    <div class="balnum mono" id="bal-${k}">${v}</div>
    <div class="gv-pm">
      <button data-act="bal" data-k="${k}" data-d="-1" aria-label="한 명 빼기">−</button>
      <button data-act="bal" data-k="${k}" data-d="1" aria-label="한 명 더하기">+</button>
    </div></div>`;
}
function balMeter(){
  const {a,b}=state.bal;
  return (a+b)
    ? `<span style="flex:${a} 1 0;background:var(--bal-a);min-width:${a?"6px":"0"}"></span><span style="flex:${b} 1 0;background:var(--bal-b);min-width:${b?"6px":"0"}"></span>`
    : `<span style="flex:1;background:var(--board-line)"></span>`;
}
/* 손을 셀 때마다 화면 전체를 다시 그리면 깜빡이므로 숫자와 막대만 고친다 */
function balBump(k,d){
  const b=state.bal; b[k]=Math.max(0,b[k]+d);
  const n=$("#bal-"+k); if(n) n.textContent=b[k];
  const mt=$("#bal-meter"); if(mt) mt.innerHTML=balMeter();
  const t=$("#bal-tot"); if(t) t.textContent=`모두 ${b.a+b.b}명`;
  ["a","b"].forEach(x=>{ const c=$("#bal-card-"+x); if(c) c.classList.toggle("lead",b.a!==b.b&&b[x]===Math.max(b.a,b.b)); });
}

/* ---- 가위바위보 ---- */
function rpsGo(){
  const r=state.rps; if(r.phase==="count") return;
  iceStop(); r.phase="count"; r.word="가위!"; render(); iceBeep(520,.1);
  const words=["바위!","보!"]; let i=0;
  const step=()=>{
    if(i<words.length){
      r.word=words[i++]; const w=$("#rps-word");
      if(w){ w.textContent=r.word; w.classList.remove("pop"); void w.offsetWidth; w.classList.add("pop"); }
      iceBeep(620+i*120,.1); iceTimer=setTimeout(step,560);
    } else {
      iceTimer=null; r.hand=Math.floor(Math.random()*3); r.round++; r.phase="show";
      render(); iceBeep(880,.12); setTimeout(()=>iceBeep(1175,.2),120);
    }
  };
  iceTimer=setTimeout(step,560);
}

/* ---- 사라진 그림 찾기 ---- */
function missBody(){
  const x=state.miss;
  if(x.phase==="idle") return `<p class="lead ice-c">그림 8개를 잠깐 보여 줄게요. 잘 기억해 두었다가, 사라진 하나를 맞혀 보세요!</p>
    <div class="icetabs" style="justify-content:center">
      <button class="icetab${!x.hard?" on":""}" data-act="miss-hard" data-k="0">쉬움 · 8초 · 자리 그대로</button>
      <button class="icetab${x.hard?" on":""}" data-act="miss-hard" data-k="1">어려움 · 5초 · 자리 섞기</button>
    </div>
    <div class="addrow" style="justify-content:center"><button class="b-btn draw-go ice-primary" data-act="miss-go">시작</button></div>`;
  const cell=(pi,cls)=>`<div class="misscell${cls||""}"><span class="e">${MISS_POOL[pi][0]}</span><span class="n">${MISS_POOL[pi][1]}</span></div>`;
  const q=`<div class="misscell q"><span class="e">?</span><span class="n">&nbsp;</span></div>`;
  const gone=x.items[x.gone];
  if(x.phase==="show") return `<p class="lead ice-c">잘 기억하세요! <b class="missleft" id="miss-left">${x.left}</b>초</p>
    <div class="missgrid">${x.items.map(pi=>cell(pi)).join("")}</div>`;
  const ans=x.phase==="answer";
  const grid=x.hard
    ? x.order.map(pi=>cell(pi)).join("")+(ans?cell(gone," hit"):"")
    : x.items.map((pi,i)=>i===x.gone?(ans?cell(pi," hit"):q):cell(pi)).join("");
  return `<p class="lead ice-c">${ans?`정답은 <b>${MISS_POOL[gone][0]} ${MISS_POOL[gone][1]}</b>!`:"무엇이 사라졌을까요? 아는 사람은 손을 들어요."}</p>
    <div class="missgrid">${grid}</div>
    <div class="addrow" style="justify-content:center">
      ${ans?`<button class="b-btn draw-go ice-primary" data-act="miss-go">한 번 더</button>`
           :`<button class="b-btn draw-go ice-primary" data-act="miss-ans">정답 보기</button>
             <button class="b-btn" data-act="draw-open">번호 뽑기</button>`}
    </div>`;
}
function missGo(){
  iceStop();
  const x=state.miss, pick=shuffleArr(MISS_POOL.map((_,i)=>i)).slice(0,8);
  Object.assign(x,{phase:"show", items:pick, gone:Math.floor(Math.random()*8), left:x.hard?5:8});
  x.order=shuffleArr(pick.filter((_,i)=>i!==x.gone));
  render(); iceBeep(700,.08);
  iceTimer=setInterval(()=>{
    x.left--; const el=$("#miss-left"); if(el) el.textContent=x.left;
    if(x.left<=3&&x.left>0) iceBeep(560,.06,"triangle");
    if(x.left<=0){ clearInterval(iceTimer); iceTimer=null; x.phase="guess"; render(); iceBeep(880,.14); }
  },1000);
}

      </div>

        <button class="b-btn" data-act="act-setup">분야 · 시간 바꾸기</button>
      </div>`;
  }
  return `<p class="lead ice-c">설명하는 사람은 화면을 보고 몸으로만 설명하고, 맞히는 모둠은 소리 내어 맞혀요.</p>
    <div class="icetabs" style="justify-content:center">${cats.map(c=>`<button class="icetab${a.cat===c?" on":""}" data-act="act-cat" data-k="${esc(c)}">${esc(c)}</button>`).join("")}</div>
    <div class="icetabs" style="justify-content:center">${[60,90,120].map(n=>`<button class="icetab${a.sec===n?" on":""}" data-act="act-sec" data-k="${n}">${n}초</button>`).join("")}</div>
    <div class="addrow" style="justify-content:center"><button class="b-btn draw-go ice-primary" data-act="act-start">시작</button></div>`;
}
function actPool(){
  const a=state.act, gs=a.cat==="전체"?ACT_WORDS:ACT_WORDS.filter(g=>g.c===a.cat), out=[];
  gs.forEach(g=>g.w.forEach(w=>out.push({w,c:g.c})));
  return shuffleArr(out);
}
function actNext(){
  const a=state.act; if(!a.pool.length) a.pool=actPool();
  a.cur=a.pool.pop();
  const w=$("#act-word"), c=$("#act-cat");
  if(w){ w.textContent=a.cur.w; w.classList.remove("pop"); void w.offsetWidth; w.classList.add("pop"); }
  if(c) c.textContent=a.cur.c;
}
function actStart(){
  iceStop();
  const a=state.act; Object.assign(a,{phase:"play", left:a.sec, log:[], pool:actPool()});
  a.cur=a.pool.pop(); render(); iceBeep(880,.12);
  iceTimer=setInterval(()=>{
    a.left--; const el=$("#act-left"); if(el) el.textContent=a.left;
    if(a.left<=5&&a.left>0) iceBeep(560,.07,"triangle");
    if(a.left<=0) actEnd();
  },1000);
}
function actMark(hit){
  const a=state.act; if(a.phase!=="play"||!a.cur) return;
  a.log.push({w:a.cur.w,hit});
  const h=$("#act-hit"), p=$("#act-pass"), n=a.log.filter(x=>x.hit).length;
  if(h) h.textContent=n; if(p) p.textContent=a.log.length-n;
  iceBeep(hit?940:320,.07,hit?"sine":"square"); actNext();
}
function actEnd(){
  if(iceTimer){ clearInterval(iceTimer); iceTimer=null; }
  state.act.phase="end"; render(); iceBeep(520,.14); setTimeout(()=>iceBeep(392,.26),160);
}

/* ---- 텔레파시 ---- */
function teleBody(){
  const t=state.tele, L=db.settings.tele||[], topic=L.length?L[t.i%L.length]:"";
  if(t.phase==="idle") return `<div class="icecenter">

/* ==================== 뽑기 (한 명 · 짝 · 모둠) ====================
   설정에 명단을 넣으면 이름으로, 비워 두면 참석 인원만큼 번호로 뽑는다.
   한 번 나온 사람은 다시 안 나오게 해서 골고루 돌아가게 한다 */
function rosterNames(){ return String(db.settings.roster||"").split(/[\n,]/).map(x=>x.trim()).filter(Boolean); }
function drawPool(m){
  const names=rosterNames();
  if(names.length) return {labels:names, names:true};
  const N=Math.max(0,parseInt(m.attendance,10)||0);
  return {labels:Array.from({length:N},(_,i)=>String(i+1)), names:false};
}

function drawHTML(m){
  if(!state.drawOpen) return "";
  const P=drawPool(m), total=P.labels.length, mode=state.drawMode||"one";
  const used=(state.drawUsed||[]).filter(x=>P.labels.includes(x));
  const res=state.drawResult&&state.drawResult.mode===mode?state.drawResult:null;
  const seg=(k,t)=>`<button class="icetab${mode===k?" on":""}" data-act="draw-mode" data-k="${k}">${t}</button>`;
  let body;
  if(total<1) body=`<p class="lead">먼저 참석 인원을 정해 주세요.</p>
      <div class="addrow"><input class="b-inp" type="number" min="1" value="20" id="draw-n" style="max-width:6em">
      <button class="b-btn draw-go" data-act="draw-setn">이 인원으로</button></div>`;
  else if(mode==="group") body=`
      <div class="addrow" style="justify-content:center;align-items:center">
        <span class="drawmeta">모둠 수</span>
        <button class="b-btn" data-act="draw-gk" data-d="-1" aria-label="모둠 줄이기">−</button>
        <b class="mono dgk">${state.drawGroups}</b>
        <button class="b-btn" data-act="draw-gk" data-d="1" aria-label="모둠 늘리기">+</button>
      </div>
      ${res?`<div class="dgroups">${res.groups.map((g,i)=>`<div class="dgroup pop"><h4>${i+1}모둠 · ${g.length}명</h4><p>${g.map(esc).join(", ")}</p></div>`).join("")}</div>`
           :`<p class="drawmeta">${total}명을 ${state.drawGroups}개 모둠으로 고르게 나눕니다.</p>`}
      <div class="addrow" style="justify-content:center">
        <button class="b-btn draw-go" data-act="draw-pick">${res?"다시 나누기":"모둠 나누기"}</button></div>`;
  else {
    const pair=mode==="pair", p=res?res.picks:null;
    body=`<div class="drawnums${P.names?" names":""}">
        <div class="drawnum${res?" settled":""}" id="drawnum0">${p?esc(p[0]):"?"}</div>
        ${pair?`<span class="drawplus">+</span><div class="drawnum${res?" settled":""}" id="drawnum1">${p?esc(p[1]):"?"}</div>`:""}
      </div>
      <p class="drawmeta">${P.names?`명단 ${total}명`:`1~${total}번`} · 남은 <b>${total-used.length}</b>명
        <span class="drawused">${used.length?(P.names?"이미 나온 사람 ":"이미 나온 번호 ")+used.map(esc).join(", "):""}</span></p>
      <div class="addrow" style="justify-content:center">
        <button class="b-btn draw-go" data-act="draw-pick">${res?"다시 뽑기":pair?"짝 뽑기":"뽑기"}</button>
        <button class="b-btn" data-act="draw-reset">처음부터</button>
      </div>`;
  }
  return `<div class="drawwrap">
    <div class="drawbox${mode==="group"?" wide":""}">
      <div class="eyebrow">${P.names?"이름":"번호"} 뽑기</div>
      <div class="icetabs" style="justify-content:center">${seg("one","한 명")}${seg("pair","짝")}${seg("group","모둠")}</div>
      ${body}
      <button class="b-btn drawclose" data-act="draw-close">닫기 (Esc)</button>
    </div>
  </div>`;
}

let drawTimer=null;
function pickNumber(){
  const m=current(); if(!m||drawTimer) return;
  const P=drawPool(m), mode=state.drawMode||"one";
  if(!P.labels.length) return;
  if(mode==="group"){
    const k=Math.max(2,Math.min(10,state.drawGroups||4));
    if(P.labels.length<k){ toast("모둠 수보다 사람이 많아야 합니다"); return; }
    const groups=Array.from({length:k},()=>[]);
    shuffleArr(P.labels).forEach((x,i)=>groups[i%k].push(x));
    /* 번호는 모둠 안에서 작은 순서로 보여야 읽기 쉽다 */
    if(!P.names) groups.forEach(g=>g.sort((a,b)=>a-b));
    state.drawResult={mode:"group", groups};
    render(); iceBeep(660,.12); setTimeout(()=>iceBeep(880,.16),120);
    return;
  }
  const need=mode==="pair"?2:1;
  state.drawUsed=(state.drawUsed||[]).filter(x=>P.labels.includes(x));
  const pool=P.labels.filter(x=>!state.drawUsed.includes(x));
  if(pool.length<need){
    toast(P.labels.length<need?"짝을 정하려면 두 명 넘게 있어야 합니다":"모두 한 번씩 나왔습니다. ‘처음부터’를 눌러 주세요");
    return;
  }
  const picks=shuffleArr(pool).slice(0,need);
  const els=[$("#drawnum0"),$("#drawnum1")].slice(0,need);
  const finish=()=>{
    clearInterval(drawTimer); drawTimer=null;
    state.drawUsed.push(...picks); state.drawResult={mode, picks};
    render(); iceBeep(700,.1); setTimeout(()=>iceBeep(1050,.2),110);
  };
  if(!els[0]||matchMedia("(prefers-reduced-motion: reduce)").matches){ finish(); return; }
  els.forEach(e=>{ if(e){ e.classList.remove("settled"); e.classList.add("rolling"); } });
  let ticks=0;
  drawTimer=setInterval(()=>{
    els.forEach(e=>{ if(e) e.textContent=pool[Math.floor(Math.random()*pool.length)]; });
    if(++ticks%3===0) iceBeep(430+Math.random()*280,.03,"square");
    if(ticks>=13) finish();
  },70);
}

function recordText(m){
  const r=m.review, L=[];
  L.push(`제 ( ${m.no} ) 회 ${m.scope} 학생자치위원회 회의록`);
  L.push(`일시: ${fmtDate(m.date)}`);
  L.push(`사회자: ${m.chair}    기록자: ${m.recorders}`);
  L.push("");
  L.push(`[이번 달 실천내용 반성]`);
  L.push(`회의주제: ${r.topic}`);
  L.push(`목표 달성 여부: 잘 지켜짐 ( ${r.good} ), 보통 ( ${r.mid} ), 잘 안 지켜짐 ( ${r.bad} )`);
  L.push("");
  L.push(`[다음 달 실천내용 선정]`);
  L.push(`회의주제: ${m.next.topic}`);
  L.push(`실천내용(우리 약속)`);
  m.next.promises.forEach((p,i)=>L.push(`  ${i+1}. ${p}`));
  L.push("");

  m.suggestions.forEach((p,i)=>L.push(`  ${i+1}. ${p}`));
  L.push("");

  L.push(m.teacherWords);
  L.push("");
  L.push(`지도교사  ${db.settings.teacher}  (인)`);
  return L.join("\n");
}

async function printRecord(){
  const m=current(); if(!m) return;
  if(!INFRAME){ window.print(); return; }   /* 내려받은 파일에서는 그냥 인쇄된다 */
  const dl=await getDownloads();
  if(!dl){ toast("이 화면에서는 인쇄가 막혀 있습니다. 글자로 복사해 한글에서 인쇄해 주세요"); return; }
  try{
    await dl.save({filename:`제${m.no}회 학생자치위원회 회의록.html`, data:recordDoc(m)});
    toast("저장했습니다. 파일을 열고 Ctrl+P로 인쇄하세요");
  }catch(err){
    const c=err&&err.code;
    if(c==="declined") return;
    if(c==="rate_limited") toast("잠시 뒤에 다시 눌러 주세요");
    else toast("저장하지 못했습니다. 글자로 복사해 한글에서 인쇄해 주세요");
  }
}

async function copyRecord(){
  const m=current(); if(!m) return;
  const txt=recordText(m);
  try{ await navigator.clipboard.writeText(txt); toast("회의록을 복사했습니다"); return; }catch(e){}
  try{
    const ta=document.createElement("textarea");
    ta.value=txt; ta.style.position="fixed"; ta.style.top="-1000px";
    document.body.appendChild(ta); ta.focus(); ta.select();
    const ok=document.execCommand("copy"); ta.remove();
    if(ok){ toast("회의록을 복사했습니다"); return; }
  }catch(e){}
  const box=$("#copybox");                  /* 둘 다 막히면 직접 복사할 수 있게 펼친다 */
  if(box){ box.hidden=false; const t=box.querySelector("textarea");
    t.value=txt; t.focus(); t.select(); t.scrollIntoView({block:"center"}); }
  else toast("복사가 막혀 있습니다");
}

/* ---------- actions ---------- */
function newMeeting(){
  const list=meetings(), last=list[0];
  const m={
    id:uid(), no:list.length?Math.max(...list.map(x=>x.no))+1:1,
    date:todayISO(), scope:last?last.scope:db.settings.scope,
    chair:"", recorders:"", attendance:last?last.attendance:(db.settings.defaultAttendance||20),
    review:{topic:last?last.next.topic:"", promises:last?last.next.promises.slice():[], good:0,mid:0,bad:0},
    next:{topic:"", promises:[]}, goalVote:[], promiseVote:[], promiseN:3, iceAnswers:[], reviewNotes:[], suggestions:[], teacherWords:"",
    done:false, updatedAt:Date.now()
  };
  db.meetings.push(m); save();
  go("prep",{id:m.id});
}

function setPath(obj,path,val){
  const ks=path.split("."); let o=obj;
  for(let i=0;i<ks.length-1;i++) o=o[ks[i]];
  o[ks[ks.length-1]]=val;
}

function bump(k,d){
  const m=current(), r=m.review;
  r[k]=Math.max(0,r[k]+d); m.updatedAt=Date.now(); save();
  /* 학생 의견 탭을 보는 중에 1·2·3을 누르면 손들기 화면으로 돌아가 보여 준다 */
  if(state.reviewTab==="notes"){ state.reviewTab="vote"; render(); return; }
  const el=document.querySelector(`[data-num="${k}"]`); if(el) el.textContent=r[k];
  const tot=r.good+r.mid+r.bad;
  const meter=$("#meter");
  if(meter){
    const bar=(v,c)=>`<span style="flex:${v||0} 1 0;background:${c};min-width:${v?"6px":"0"}"></span>`;
    meter.innerHTML=tot?bar(r.good,"var(--good-b)")+bar(r.mid,"var(--mid-b)")+bar(r.bad,"var(--bad-b)")
      :`<span style="flex:1;background:var(--board-line)"></span>`;
    meter.setAttribute("aria-label",`잘 지켜짐 ${r.good}명, 보통 ${r.mid}명, 잘 안 지켜짐 ${r.bad}명`);
  }
  const t=$("#tot"); if(t) t.textContent=`응답 ${tot}명`;
  const rail=railBtn("review");
  if(rail) rail.classList.toggle("filled",tot>0);
}

function addItem(kind){
  if(kind==="pcand"){ addPv($("#add-pcand").value); return; }
  if(kind==="cand"){
    const inp=$("#add-cand"); addCandidate(inp.value); inp.value=""; inp.focus(); return;
  }
  if(kind==="topic"){
    const inp=$("#add-topic"), v=inp.value.trim(); if(!v) return;
    db.settings.topicBank.push(v); save(); render();
    setTimeout(()=>{const i=$("#add-topic"); if(i) i.focus();},0); return;
  }
  const m=current();
  const inp=$(kind==="promise"?"#add-promise":"#add-suggest");
  const v=inp.value.trim(); if(!v) return;
  (kind==="promise"?m.next.promises:m.suggestions).push(v);
  m.updatedAt=Date.now(); save();
  refreshList(kind); inp.value=""; inp.focus();
}

function refreshList(kind){
  const m=current();
  const ul=$(kind==="promise"?"#plist":"#slist");
  const arr=kind==="promise"?m.next.promises:m.suggestions;
  if(ul){ ul.innerHTML=listItems(arr,kind); ul.className=plistClass(arr.length,kind==="promise"); }
  const id=kind==="promise"?"promise":"suggest";
  const rail=railBtn(id);
  if(rail) rail.classList.toggle("filled",stepFilled(m,id));
}

/* 회의를 새로 열 때마다 뽑기와 놀이를 처음 상태로 되돌린다 */
function startRun(id){
  const qn=(db.settings.questions||[]).length, cn=(db.settings.quiz||[]).length;
  iceStop();
  const bn=(db.settings.balance||[]).length, on=(db.settings.ox||[]).length;
  const rnd=n=>n?Math.floor(Math.random()*n):0;
  Object.assign(state,{drawOpen:false, drawUsed:[], drawResult:null, drawMode:"one", goalAdd:false,
    qrOpen:false, impOpen:false, impItems:null, liveOpen:false, reviewTab:"vote", promiseTab:null,
    iceMode:"menu", iceShow:false, iceFirst:false, iceQ:rnd(qn), iceC:rnd(cn),
    bal:{i:rnd(bn),a:0,b:0}, rps:{phase:"idle",round:0,hand:0,word:""}, ox:{i:rnd(on),show:false},
    miss:{phase:"idle",hard:state.miss.hard}, act:{phase:"setup",cat:state.act.cat,sec:state.act.sec},
    tele:{phase:"idle",i:0,n:3}});
  go("run",{id:id||state.id, step:0});
}

function nav(d){
  const n=state.step+d;
  if(n<0||n>=steps().length) return;
  Object.assign(state,{step:n, drawOpen:false, qrOpen:false, impOpen:false, impItems:null}); render();
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  const a=b.dataset.act, m=current();
  switch(a){
    case "home": go("home",{id:null}); break;
    case "settings": go("settings"); break;
    case "new": newMeeting(); break;
    case "setup-done": {
      if(!db.settings.teacher.trim()){ toast("담임 선생님 이름을 넣어 주세요"); $("#q-teacher").focus(); break; }
      db.settings.setupDone=true; saveNow(); render(); toast("준비됐습니다");
      break;
    }
    case "start": startRun(state.id); break;
    case "open": startRun(b.dataset.id); break;
    case "record": go("record",{id:b.dataset.id}); break;
    case "exit": go("home",{id:null}); break;
    case "prev": nav(-1); break;
    case "next": nav(1); break;
    case "jump": Object.assign(state,{step:+b.dataset.i, drawOpen:false, qrOpen:false, impOpen:false, impItems:null}); render(); break;
    case "vote": bump(b.dataset.k,+b.dataset.d); break;
    case "toggle": toggleAudio(); break;
    case "ts": {
      const cur=db.settings.textScale||1;
      db.settings.textScale=Math.min(2,Math.max(.7,Math.round((cur+(+b.dataset.d)*.1)*10)/10));
      save(); render(); toast("글자 크기 "+Math.round(db.settings.textScale*100)+"%");
      break;
    }
    /* ---- 여는 놀이 ---- */
    case "ice-go": {
      const k=b.dataset.k; iceStop();
      if(k==="draw"){ Object.assign(state,{drawOpen:true, drawMode:"pair", drawResult:null}); render(); break; }
      state.iceMode=k; render(); break;
    }
    case "ice-menu": iceStop(); state.iceMode="menu"; render(); break;
    case "ice-next": state.iceQ=(state.iceQ||0)+1; render(); iceBeep(620,.06); break;
    case "ice-show":                              /* 초성: 정답 보기 → 다음 문제 */
      if(!state.iceShow){ state.iceShow=true; iceBeep(880,.1); setTimeout(()=>iceBeep(1175,.18),110); }
      else { state.iceC=(state.iceC||0)+1; state.iceShow=false; state.iceFirst=false; iceBeep(700,.07); }
      render(); break;
    case "ice-first": state.iceFirst=true; render(); iceBeep(600,.08); break;
    case "bal": balBump(b.dataset.k,+b.dataset.d); break;
    case "bal-next": state.bal={i:state.bal.i+1,a:0,b:0}; render(); iceBeep(620,.06); break;
    case "rps-go": rpsGo(); break;
    case "rps-reset": iceStop(); state.rps={phase:"idle",round:0,hand:0,word:""}; render(); break;
    case "ox-go":
      if(!state.ox.show){ state.ox.show=true; iceBeep(880,.1); }
      else { state.ox={i:state.ox.i+1,show:false}; iceBeep(620,.06); }
      render(); break;
    case "miss-hard": state.miss.hard=b.dataset.k==="1"; render(); break;
    case "miss-go": missGo(); break;
    case "miss-ans": state.miss.phase="answer"; render(); iceBeep(880,.1); setTimeout(()=>iceBeep(1175,.2),110); break;
    case "act-cat": state.act.cat=b.dataset.k; render(); break;
    case "act-sec": state.act.sec=+b.dataset.k; render(); break;
    case "act-start": actStart(); break;
    case "act-hit": actMark(true); break;
    case "act-pass": actMark(false); break;
    case "act-end": actEnd(); break;
    case "act-setup": state.act.phase="setup"; render(); break;
    case "tele-topic": {
      iceStop(); const L=db.settings.tele||[];
      state.tele.i=L.length?Math.floor(Math.random()*L.length):0; state.tele.phase="topic";
      render(); iceBeep(660,.08); break;
    }
    case "tele-go": teleGo(); break;
    case "draw-mode": state.drawMode=b.dataset.k; state.drawResult=null; render(); break;
    case "draw-gk":
      state.drawGroups=Math.max(2,Math.min(10,(state.drawGroups||4)+(+b.dataset.d)));
      state.drawResult=null; render(); break;
    case "draw-open": state.drawOpen=true; render(); break;
    case "draw-close": state.drawOpen=false; render(); break;
    case "qr-open": Object.assign(state,{qrOpen:true, qrFor:steps()[state.step].id}); render(); break;
    case "qr-close": state.qrOpen=false; render(); break;
    case "imp-open": {
      Object.assign(state,{impOpen:true, impFor:steps()[state.step].id, impItems:null,
        impSrc:null, impErr:"", impBusy:false});
      render();
      /* 자동으로 읽을 수 있으면 누르자마자 읽는다(패들렛은 첫 번째에 연결 허락 창이 뜬다).
         앱 링크에서 구글 설문지를 고른 경우엔 autoImport 가 이유를 띄운다 */
      if(autoSource()||(useGform()&&inArtifact())) autoImport();
      else setTimeout(()=>{ const t=$("#imp-text"); if(t) t.focus(); },0);
      break;
    }
    case "imp-auto": autoImport(); break;
    case "live-open": liveStart(); break;
    case "live-close": state.liveOpen=false; render(); break;
    case "live-apply": liveApply(); break;
    case "live-tog": {
      const id=b.dataset.id, kind=steps()[state.step].id, x=liveList(kind).find(i=>i.id===id); if(!x) break;
      if(x.hidden){ live.shown.add(id); paintLive(); break; }    /* 가려진 글은 먼저 내용만 보여 준다 */
      if(x.on){ live.on.delete(id); live.off.add(id); } else { live.off.delete(id); live.on.add(id); }
      paintLive(); break;
    }
    case "live-del":
      if(live.fs&&live.code) live.fs.collection("rooms").doc(live.code).collection("items").doc(b.dataset.id).delete().catch(()=>{});
      break;
    case "live-end": {
      if(b.dataset.armed!=="1"){                /* 되돌릴 수 없으니 두 번 누르게 한다 */
        b.dataset.armed="1"; b.textContent="한 번 더 누르면 지웁니다"; b.classList.add("btn-danger");
        setTimeout(()=>{ if(b.isConnected){ b.dataset.armed="0"; b.textContent="의견함 지우기"; b.classList.remove("btn-danger"); } },6000);
        break;
      }
      const code=live.code, mm=current();
      if(live.unsub) live.unsub();
      Object.assign(live,{unsub:null,code:null,items:[],open:false});
      state.liveOpen=false;
      if(mm) delete mm.liveCode;
      db.settings.liveRooms=(db.settings.liveRooms||[]).filter(x=>x.code!==code); saveNow(); render();
      if(code) liveDeleteRoom(code).then(()=>toast("의견함을 지웠습니다"),()=>toast("의견함을 지우지 못했습니다"));
      break;
    }
    case "copy-labels": {
      const ta=$("#gform-labels"), txt=Object.values(GFORM_LABEL).join("\n");
      const fallback=()=>{ ta.focus(); ta.select(); toast("선택해 두었습니다. Ctrl+C로 복사하세요"); };
      try{ navigator.clipboard.writeText(txt).then(()=>toast("보기 다섯 개를 복사했습니다"),fallback); }
      catch(e){ fallback(); }
      break;
    }
    case "imp-close": Object.assign(state,{impOpen:false, impItems:null, impSrc:null, impErr:""}); render(); break;
    case "imp-back": Object.assign(state,{impItems:null, impSrc:null, impErr:""}); render();
      setTimeout(()=>{ const t=$("#imp-text"); if(t&&t.offsetParent) t.focus(); },0); break;
    case "imp-parse": {
      const have=new Set(importTarget(m,state.impFor));
      state.impItems=parsePasted($("#imp-text").value)
        .map(o=>({t:o.t, dup:have.has(o.t), name:o.name, joke:o.joke, on:!have.has(o.t)&&!o.name&&!o.joke}));
      state.impSrc={auto:false};
      render(); break;
    }
    case "imp-apply": applyImport(); break;
    case "ice-clear": m.iceAnswers=[]; m.updatedAt=Date.now(); save(); render(); break;
    case "rv-tab": state.reviewTab=b.dataset.k; render(); break;
    case "rv-clear": m.reviewNotes=[]; state.reviewTab="vote"; m.updatedAt=Date.now(); save(); render(); break;
    case "draw-pick": pickNumber(); break;
    case "draw-reset": state.drawUsed=[]; state.drawResult=null; render(); toast("처음부터 다시 뽑습니다"); break;
    case "draw-setn": {
      const v=Math.max(1,parseInt($("#draw-n").value||"20",10));
      m.attendance=v; m.updatedAt=Date.now(); save(); render(); break;
    }
    case "seek": {
      const a=audioEl; if(!a||!isFinite(a.duration)||!a.duration) break;
      const r=b.getBoundingClientRect();
      a.currentTime=Math.min(a.duration,Math.max(0,(e.clientX-r.left)/r.width*a.duration));
      break;
    }
    case "audio-reset": {
      const k=b.dataset.k;
      idbDel(k).then(()=>{ delete userAudio[k]; dropPlayer(k); render(); toast("기본 음원으로 되돌렸습니다"); });
      break;
    }
    case "add": addItem(b.dataset.k); break;
    case "rm": {
      const k=b.dataset.k, i=+b.dataset.i;
      (k==="promise"?m.next.promises:m.suggestions).splice(i,1);
      m.updatedAt=Date.now(); save(); refreshList(k); break;
    }
    case "rm-topic": db.settings.topicBank.splice(+b.dataset.i,1); save(); render(); break;
    case "goto": { const i=stepIndex(b.dataset.id); if(i>=0){ state.step=i; render(); } break; }
    case "gv": bumpGoal(+b.dataset.i, +b.dataset.d); break;
    case "gv-rm": {
      (m.goalVote||[]).splice(+b.dataset.i,1); m.updatedAt=Date.now(); save(); paintGoal(); break;
    }
    case "gv-addv": addCandidate(b.dataset.v); break;
    case "gv-add": addCandidate($("#add-cand").value); break;
    case "gv-addtoggle": state.goalAdd=!state.goalAdd; render(); break;
    case "pv-tab": state.promiseTab=b.dataset.k; render(); break;
    case "pv": bumpPv(+b.dataset.i,+b.dataset.d); break;
    case "pv-rm": (m.promiseVote||[]).splice(+b.dataset.i,1); m.updatedAt=Date.now(); save(); render(); break;
    case "pv-add": addPv($("#add-pcand").value); break;
    case "pv-pick": pickPv(); break;
    case "pv-n": {
      const L=(m.promiseVote||[]).length;
      m.promiseN=Math.max(1,Math.min(L,Math.min(L,m.promiseN||3)+(+b.dataset.d)));
      m.updatedAt=Date.now(); save(); paintPv(); break;
    }
    case "gv-pick": {
      m.next.topic=b.dataset.v; m.updatedAt=Date.now(); save();
      const inp=document.querySelector('[data-bind="next.topic"]'); if(inp) inp.value=m.next.topic;
      const rail=railBtn("goal"); if(rail) rail.classList.add("filled");
      toast(`다음 달 목표를 “${m.next.topic}”(으)로 정했습니다`);
      break;
    }
    case "finish": m.done=true; m.updatedAt=Date.now(); save(); go("record",{id:m.id}); break;
    case "fs": {
      try{ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen(); }
      catch(err){ toast("이 화면에서는 전체화면을 쓸 수 없습니다"); }
      break;
    }
    case "edit": go("prep",{id:b.dataset.id}); break;
    case "print": printRecord(); break;
    case "copy": copyRecord(); break;
    case "del": state.confirmDel=b.dataset.id; render(); break;
    case "del-no": state.confirmDel=null; render(); break;
    case "del-yes": {
      const id=b.dataset.id, t=db.meetings.find(x=>x.id===id);
      db.meetings=db.meetings.filter(x=>x.id!==id);
      state.confirmDel=null;
      if(state.id===id) state.id=null;
      saveNow(); render();
      if(t) toast(`제 ${t.no}회 기록을 지웠습니다`);
      break;
    }
    case "backup": {
      const ta=$("#backup"); ta.value=JSON.stringify(db);
      ta.select(); toast("복사해서 안전한 곳에 보관하세요"); break;
    }
    case "restore": {
      const ta=$("#backup");
      let next;
      try{
        next=JSON.parse(ta.value);
        if(!next||!Array.isArray(next.meetings)) throw 0;
      }catch(err){ toast("백업 글자를 알아볼 수 없습니다"); break; }
      if(b.dataset.armed!=="1"){          /* 확인 창이 막히므로 두 번 누르게 한다 */
        b.dataset.armed="1"; b.textContent="한 번 더 누르면 덮어씁니다";
        b.classList.add("btn-danger");
        setTimeout(()=>{ if(b.isConnected){
          b.dataset.armed="0"; b.textContent="복원"; b.classList.remove("btn-danger"); } },6000);
        break;
      }
      db=next; db.settings=Object.assign({},DEFAULTS.settings,db.settings);
      saveNow(); go("home",{id:null}); toast("복원했습니다");
      break;
    }
  }
});

document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.bind){
    const m=current(); if(!m) return;
    let v=t.value;
    if(t.dataset.bind==="attendance") v=Math.max(0,parseInt(v||"0",10));
    if(t.dataset.bind==="no") v=Math.max(1,parseInt(v||"1",10));
    setPath(m,t.dataset.bind,v); m.updatedAt=Date.now(); save();
    if(t.dataset.bind==="next.topic"||t.dataset.bind==="teacherWords"){
      const id=t.dataset.bind==="next.topic"?"goal":"words";
      const rail=railBtn(id);
      if(rail) rail.classList.toggle("filled",stepFilled(m,id));
    }
  }
  if(t.dataset.set){ db.settings[t.dataset.set]=t.value; save();
    /* 설문지 주소를 시트 칸에 잘못 넣는 일이 흔해서 바로 알려 준다 */
    if(t.dataset.set==="gformSheet"){ const w=$("#gsheet-warn"); if(w) w.hidden=!t.value.trim()||!!gformSheetId(); }
  }
  if(t.dataset.setNum){ db.settings[t.dataset.setNum]=Math.max(1,parseInt(t.value||"1",10)); save(); }
  if(t.dataset.setLines){
    db.settings[t.dataset.setLines]=t.value.split("\n").map(x=>x.trim()).filter(Boolean);
    save();
  }
});

document.addEventListener("change",e=>{
  const t=e.target;
  /* 체크 하나 바꿀 때마다 다시 그리면 목록이 맨 위로 튀므로 버튼 글자만 고친다 */
  if(t.dataset.imp!==undefined&&state.impItems){
    state.impItems[+t.dataset.imp].on=t.checked;
    const n=state.impItems.filter(x=>x.on).length, b=$("#imp-apply");
    if(b){ b.textContent=`선택한 ${n}개 넣기`; b.disabled=!n; }
    return;
  }
  if(t.dataset.setBool){ db.settings[t.dataset.setBool]=t.checked; save(); return; }
  /* 의견 받는 곳을 바꾸면 해당 설정 칸만 보이게 다시 그린다 */
  if(t.dataset.setRadio){ db.settings[t.dataset.setRadio]=t.value; saveNow(); render(); return; }
  if(t.dataset.audio){
    const k=t.dataset.audio, f=t.files&&t.files[0]; if(!f) return;
    if(f.size>12*1024*1024){ toast("파일이 너무 큽니다 (12MB까지)"); t.value=""; return; }
    const fr=new FileReader();
    fr.onload=()=>{
      idbPut(k,fr.result).then(()=>{
        userAudio[k]=fr.result; dropPlayer(k);
        render(); toast(TRACK_NAME[k]+" 음원을 넣었습니다");
      }).catch(()=>toast("저장하지 못했습니다"));
    };
    fr.onerror=()=>toast("파일을 읽지 못했습니다");
    fr.readAsDataURL(f);
  }
});

document.addEventListener("keydown",e=>{
  const t=e.target, typing=/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName);
  /* 붙여넣기 칸에 글자를 넣던 중이어도 Esc로는 창을 닫을 수 있게 한다 */
  if(e.key==="Escape"&&(state.qrOpen||state.impOpen||state.liveOpen)){
    e.preventDefault(); Object.assign(state,{qrOpen:false, impOpen:false, impItems:null, liveOpen:false}); render(); return;
  }
  if(typing){
    if(e.key==="Enter"&&t.dataset.add){ e.preventDefault(); addItem(t.dataset.add); }
    return;
  }
  if(state.view!=="run") return;
  /* QR이나 가져오기 창이 떠 있으면 화면이 넘어가지 않게 막는다 */
  if(state.qrOpen||state.impOpen||state.liveOpen) return;
  /* 번호 뽑기가 떠 있으면 화면이 넘어가지 않게 막는다 */
  if(state.drawOpen){
    if(e.key==="Escape"){ e.preventDefault(); state.drawOpen=false; render(); }
    else if(e.key==="Enter"||e.key===" "||e.key==="r"||e.key==="R"){ e.preventDefault(); pickNumber(); }
    return;
  }
  /* 놀이를 하는 중에는 스페이스·엔터가 그 놀이의 주 단추를 누른다(놀이상자와 같게).
     놀이 도중 화면이 넘어가 버리지 않도록. 화면 넘기기는 화살표로 */
  if(onIceSlide()&&state.iceMode!=="menu"){
    if(e.key===" "||e.key==="Enter"){
      e.preventDefault(); const p=document.querySelector(".ice-primary");
      if(p&&!p.disabled) p.click(); return;
    }
    if(e.key==="Escape"){ e.preventDefault(); iceStop(); state.iceMode="menu"; render(); return; }
    if(state.iceMode==="act"&&state.act.phase==="play"&&e.key==="ArrowRight"){ e.preventDefault(); actMark(false); return; }
    if(state.iceMode==="bal"&&(e.key==="1"||e.key==="2")){ e.preventDefault(); balBump(e.key==="1"?"a":"b",e.shiftKey?-1:1); return; }
  }
  if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" "){ e.preventDefault(); nav(1); }
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){ e.preventDefault(); nav(-1); }
  else if(e.key==="p"||e.key==="P"){ e.preventDefault(); toggleAudio(); }
  else if(e.key==="r"||e.key==="R"){ e.preventDefault(); state.drawOpen=true; render(); }
  else if(e.key==="+"||e.key==="="){ e.preventDefault();
    document.querySelector('[data-act="ts"][data-d="1"]').click(); }
  else if(e.key==="-"||e.key==="_"){ e.preventDefault();
    document.querySelector('[data-act="ts"][data-d="-1"]').click(); }
  else if((steps()[state.step]||{}).id==="review"&&"123".includes(e.key)){
    e.preventDefault(); bump(["good","mid","bad"][+e.key-1], e.shiftKey?-1:1);
  }
  else if((steps()[state.step]||{}).id==="promise"&&promiseTab(current())==="vote"&&/^[1-9]$/.test(e.key)){
    e.preventDefault(); bumpPv(+e.key-1, e.shiftKey?-1:1);
  }
  else if((steps()[state.step]||{}).id==="goal"&&/^[1-9]$/.test(e.key)){
    e.preventDefault(); bumpGoal(+e.key-1, e.shiftKey?-1:1);
  }
});

load();
liveMigrate();
render();
idbLoadAll().then(()=>{
  const ks=Object.keys(userAudio);
  if(ks.length){ ks.forEach(dropPlayer); render(); }
});
</script>
